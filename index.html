      if (n.__zhA) { Object.keys(n.__zhA).forEach((a) => n.setAttribute(a, n.__zhA[a])); n.__zhA = null; }
      n.childNodes.forEach(walk);
    };
    walk(root);
  }
  const obs = new MutationObserver((muts) => { if (lang !== "en") return; muts.forEach((m) => m.addedNodes.forEach(translateNode)); });

  window.KAIDA_I18N = {
    tr, get lang() { return lang; },
    set(l, rerender) {
      lang = l === "en" ? "en" : "zh";
      try { localStorage.setItem("kaida-lang", lang); } catch (e) { /* 忽略 */ }
      document.documentElement.lang = lang === "en" ? "en" : "zh-Hant-TW";
      document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
      if (lang === "zh") restore(document.body);
      rerender && rerender();
      translateNode(document.body);
    },
    start() { obs.observe(document.body, { childList: true, subtree: true }); }
  };
})();

</script>
<script>
/* 原型主程式：純前端、無框架。
   路由用網址 # 後的簡單代號：#works、#work.<id>、#feedback.<id>、#submit、#ideas、#tester
   使用者新增的資料存在瀏覽器 localStorage（只在你自己的瀏覽器裡），頁尾可清除。 */
(function () {
  "use strict";
  const M = window.MOCK;
  const STORE_KEY = "vibe-proto-v1";
  const $app = document.getElementById("app");

  // ---------- state ----------
  const blank = () => ({ user: null, newWorks: [], patches: {}, feedback: {}, ideas: [], wants: {}, backed: {}, owned: {} });
  let S = blank();
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) { /* 無法讀取就用預設 */ }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* 私密模式等情況，僅保留在記憶體 */ } }

  const clone = (o) => JSON.parse(JSON.stringify(o));
  function allWorks() {
    return M.works.map(clone).concat(S.newWorks.map(clone)).map((w) => {
      const p = S.patches[w.id];
      if (p) {
        Object.assign(w, p.top || {});
        if (p.beta) Object.assign(w.beta, p.beta);
        if (p.funding) w.funding = Object.assign(w.funding || {}, p.funding);
        if (p.health) w.health = p.health;
      }
      w.feedback = (S.feedback[w.id] || []).concat(w.feedback || []);
      return w;
    });
  }
  const getWork = (id) => allWorks().find((w) => w.id === id);
  function patch(id, part, obj) {
    const p = (S.patches[id] = S.patches[id] || {});
    p[part] = Object.assign(p[part] || {}, obj);
    save();
  }

  // ---------- helpers ----------
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => "NT$" + Math.round(n).toLocaleString("en-US");
  const pct = (a, b) => (b > 0 ? Math.min(100, Math.round((a / b) * 100)) : 0);
  const today = () => new Date().toISOString().slice(0, 10);
  const stageLabel = (s) => M.stages[s].label;
  const stagePill = (s) => `<span class="stage ${s}">${stageLabel(s)}</span>`;
  const stars = (n) => "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n));
  const sevLabel = { none: "沒遇到問題", minor: "小問題", major: "影響使用", critical: "無法使用" };
  const payLabel = { yes: "願意付費", maybe: "看價格", no: "不會付費" };

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }
  function dialog(html, onMount) {
    const back = document.createElement("div");
    back.className = "dialog-back";
    back.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(back);
    const close = () => back.remove();
    back.addEventListener("click", (e) => { if (e.target === back || e.target.closest("[data-close]")) close(); });
    onMount && onMount(back.querySelector(".dialog"), close);
    const f = back.querySelector("button, input"); f && f.focus();
    return close;
  }
  function needLogin(then) {
    if (S.user) return then();
    dialog(`<h2>登入開達</h2>
      <p class="muted">登入後可以參加封測、提交作品、發表點子、支持募資和在商店購買。</p>
      <div class="role-opts"><span class="small muted">同時加入（預設都勾選，可以取消）</span>
        <label class="tester-opt"><input type="checkbox" id="dlg-tester" checked><span><b>成為測試者</b><span class="small muted">搶先試用新作品、填回饋升等級，之後可換點數或互測額度。</span></span></label>
        <label class="tester-opt"><input type="checkbox" id="dlg-creator" checked><span><b>成為創作者</b><span class="small muted">提交自己的作品，找測試者封測，之後可以上架商店或開募資。</span></span></label></div>
      <p class="small muted">原型沒有真正的帳號系統，會用示範帳號「小安」登入，資料只存在你的瀏覽器。</p>
      <div class="btn-row"><button class="btn primary" id="dlg-login">用 Google 登入（示範）</button><button class="btn ghost" data-close>取消</button></div>`,
      (el, close) => el.querySelector("#dlg-login").onclick = () => {
        const t = el.querySelector("#dlg-tester").checked, c = el.querySelector("#dlg-creator").checked;
        S.user = { name: "小安", tester: t, creator: c, interests: [], onboarded: false }; save(); close(); renderTop();
        if (t || c) toast(t && c ? "歡迎加入測試者和創作者" : t ? "歡迎加入測試者" : "歡迎加入創作者");
        askInterests(() => { render(); then(); });
      });
  }

  // ---------- 分類（大類 → 子類）與興趣 ----------
  const CATS = M.categories;
  const catOf = (id) => CATS.find((c) => c.id === id);
  const subName = (c, sid) => { const x = c && c.subs.find((t) => t[0] === sid); return x ? x[1] : ""; };
  function catLine(o) {
    const c = catOf(o.cat); if (!c) return "";
    return `<span class="cat-line"><span>${esc(c.zh)}</span>${o.sub ? `<span>${esc(subName(c, o.sub))}</span>` : ""}</span>`;
  }
  const matchCat = (o, f) => (f.cat === "all" || o.cat === f.cat) && (f.sub === "all" || o.sub === f.sub);
  // 兩排篩選：大類，選了大類再出現子類
  function catFilters(items, f) {
    const n = (fn) => items.filter(fn).length;
    const c = catOf(f.cat);
    return `<div class="cat-filter">
      <div class="filters cats" role="group" aria-label="依分類篩選">
        <button class="filter" data-cat="all" aria-pressed="${f.cat === "all"}">全部分類 <span class="num">${items.length}</span></button>
        ${CATS.map((x) => { const k = n((o) => o.cat === x.id); return `<button class="filter${k ? "" : " zero"}" data-cat="${x.id}" aria-pressed="${f.cat === x.id}">${esc(x.zh)} <span class="num">${k}</span></button>`; }).join("")}
      </div>
      ${c ? `<div class="filters subs" role="group" aria-label="依子分類篩選">
        <button class="filter sm" data-sub="all" aria-pressed="${f.sub === "all"}">全部</button>
        ${c.subs.map(([id, zh]) => { const k = n((o) => o.cat === c.id && o.sub === id); return `<button class="filter sm${k ? "" : " zero"}" data-sub="${id}" aria-pressed="${f.sub === id}">${esc(zh)} <span class="num">${k}</span></button>`; }).join("")}
      </div>` : ""}
    </div>`;
  }
  function bindCatFilters(f, rerender) {
    $app.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => { f.cat = b.dataset.cat; f.sub = "all"; rerender(); }));
    $app.querySelectorAll("[data-sub]").forEach((b) => (b.onclick = () => { f.sub = b.dataset.sub; rerender(); }));
  }
  // 表單用的兩層下拉選單
  function catSelects(prefix, cat, sub) {
    const c0 = catOf(cat) || CATS[0];
    return `<div class="cat-selects"><select id="${prefix}-cat" class="input" aria-label="大類">${CATS.map((c) => `<option value="${c.id}" ${c === c0 ? "selected" : ""}>${esc(c.zh)}</option>`).join("")}</select>
      <select id="${prefix}-sub" class="input" aria-label="子類">${c0.subs.map(([id, zh]) => `<option value="${id}" ${id === sub ? "selected" : ""}>${esc(zh)}</option>`).join("")}</select></div>`;
  }
  function bindCatSelects(root, prefix) {
    const cs = root.querySelector(`#${prefix}-cat`), ss = root.querySelector(`#${prefix}-sub`);
    cs.onchange = () => { ss.innerHTML = catOf(cs.value).subs.map(([id, zh]) => `<option value="${id}">${esc(zh)}</option>`).join(""); };
    return () => ({ cat: cs.value, sub: ss.value });
  }
  // 興趣：存成「大類.子類」
  const interests = () => (S.user && S.user.interests) || [];
  function interestPicker(sel) {
    return `<div class="pick">${CATS.map((c) => `<fieldset class="pick-group"><legend>${esc(c.zh)}</legend><div class="checks-in">
      ${c.subs.map(([id, zh]) => { const k = c.id + "." + id; return `<label><input type="checkbox" name="interest" value="${k}" ${sel.includes(k) ? "checked" : ""}> ${esc(zh)}</label>`; }).join("")}
      </div></fieldset>`).join("")}</div>`;
  }
  const readPicker = (root) => [...root.querySelectorAll('[name="interest"]:checked')].map((x) => x.value);
  function askInterests(then) {
    dialog(`<h2>你對什麼有興趣？</h2>
      <p class="muted">選幾個你想看的類型，首頁會優先推薦相關的作品。之後隨時可以在帳號頁修改。</p>
      ${interestPicker(interests())}
      <div class="btn-row sticky-actions"><button class="btn primary" id="dlg-int">完成，幫我推薦</button><button class="btn ghost" id="dlg-skip">先跳過</button></div>`,
      (el, close) => {
        el.classList.add("tall");
        const done = (list) => { S.user.interests = list; S.user.onboarded = true; save(); close(); if (list.length) toast(`已記下 ${list.length} 個興趣`); then && then(); };
        el.querySelector("#dlg-int").onclick = () => done(readPicker(el));
        el.querySelector("#dlg-skip").onclick = () => done(interests());
      });
  }
  // 推薦分數：子類相符 3 分、同大類 1 分；點子階段不推薦
  function recommended(ws) {
    const list = interests(); if (!list.length) return [];
    const cats = list.map((k) => k.split(".")[0]);
    return ws.filter((w) => w.stage !== "idea").map((w) => ({ w, sc: (list.includes(w.cat + "." + w.sub) ? 3 : 0) + (cats.includes(w.cat) ? 1 : 0) }))
      .filter((x) => x.sc > 0).sort((a, b) => b.sc - a.sc || b.w.beta.completed - a.w.beta.completed).map((x) => x.w);
  }

  // 封測門檻判斷：回傳每一項條件是否達成
  function gate(w) {
    const fails = (w.health || []).filter((h) => h.status === "fail");
    const items = [
      { ok: w.beta.completed >= M.rules.minTesters, text: `至少 ${M.rules.minTesters} 位測試者完成全部必做任務（目前 ${w.beta.completed} 位）` },
      { ok: (w.health || []).length > 0 && (!M.rules.blockOnHealthFail || fails.length === 0), text: fails.length ? `AI 健檢沒有「未通過」項目（目前 ${fails.length} 項未通過）` : "AI 健檢沒有「未通過」項目" }
    ];
    return { items, ok: items.every((i) => i.ok) };
  }

  // ---------- 標誌與階段軌道 ----------
  const LOGO = `<svg role="img" aria-label="Kaida" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 100"><defs><clipPath id="cs-nav"><rect x="0" y="14" width="100" height="72"/></clipPath></defs><g clip-path="url(#cs-nav)"><path d="M13.5 96 V68 H36 V48 H58 V30 H68" fill="none" style="stroke:currentColor" stroke-width="11" stroke-linejoin="miter"/><circle cx="77" cy="23" r="9" style="fill:var(--logo-accent, #9a7440)"/></g><g transform="translate(114 0)"><defs><clipPath id="cw-b-nav"><rect x="-20" y="14" width="302.0" height="72"/></clipPath></defs><g clip-path="url(#cw-b-nav)" stroke-width="11" fill="none"><g style="stroke:currentColor"><line x1="5.5" y1="4.0" x2="5.5" y2="96.0"/><line x1="7.5" y1="54.0" x2="46.0" y2="4.0"/><line x1="15.5" y1="47.0" x2="50.0" y2="96.0"/></g><polyline points="59.36,95.36 84.00,29.66 108.64,95.36" style="stroke:currentColor" stroke-linejoin="miter" stroke-miterlimit="20"/><g style="stroke:currentColor"><line x1="125.5" y1="4.0" x2="125.5" y2="96.0"/></g><g style="stroke:currentColor"><line x1="151.5" y1="4.0" x2="151.5" y2="96.0"/><path d="M151.5 19.5 H165 A30.5 30.5 0 0 1 165 80.5 H151.5" fill="none"/></g><polyline points="210.36,95.36 235.00,29.66 259.64,95.36" style="stroke:currentColor" stroke-linejoin="miter" stroke-miterlimit="20"/></g></g></svg>`;
  const TRACK = ["點子", "封測", "發布", "募資", "交付"];
  function track(stage, names) {
    const cur = M.stages[stage].order;
    return `<div aria-label="目前階段：${stageLabel(stage)}"><div class="track" aria-hidden="true">${TRACK.map((_, i) => `<i class="${i < cur ? "on" : i === cur ? "now" : ""}"></i>`).join("")}</div>
      ${names ? `<div class="track-names" aria-hidden="true">${TRACK.map((t, i) => `<span class="${i === cur ? "cur" : ""}">${t}</span>`).join("")}</div>` : ""}</div>`;
  }

  // ---------- 假截圖（SVG，跟著風格變色） ----------
  function shotSVG(w, i) {
    const f = (v) => `style="fill:var(${v})"`;
    const rows = [0, 1, 2, 3].map((r) => `<rect x="16" y="${92 + r * 54}" width="148" height="44" ${f("--sunk")}/><rect x="26" y="${104 + r * 54}" width="${60 + ((r * 37 + i * 23) % 70)}" height="6" ${f("--muted")} opacity=".7"/><rect x="26" y="${118 + r * 54}" width="40" height="5" ${f("--line")}/>`).join("");
    const labels = ["首頁", "主要功能", "結果頁"];
    return `<svg viewBox="0 0 180 320" role="img" aria-label="${esc(w.name)} 截圖 ${i + 1}（示意）">
      <rect width="180" height="320" ${f("--paper")}/>
      <rect x="16" y="24" width="60" height="6" ${f("--muted")}/>
      <text x="16" y="62" font-size="18" font-weight="600" ${f("--ink")} font-family="Noto Sans TC, sans-serif">${esc(labels[i])}</text>
      ${rows}
      <rect x="16" y="292" width="${60 + i * 30}" height="4" ${f("--signal")}/>
    </svg>`;
  }

  // ---------- 風格切換 ----------
  function applySkin(s) {
    if (s === "cyber") document.documentElement.setAttribute("data-skin", "cyber");
    else document.documentElement.removeAttribute("data-skin");
    document.querySelectorAll(".skin button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.skin === (s === "cyber" ? "cyber" : "beige"))));
    const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = s === "cyber" ? "#07080d" : "#f2ece1";
  }
  let savedSkin = null;
  try { savedSkin = localStorage.getItem("kaida-skin"); } catch (e) { /* 無法讀取就用預設米色 */ }
  applySkin(savedSkin);
  document.querySelectorAll(".skin button").forEach((b) => (b.onclick = () => { applySkin(b.dataset.skin); try { localStorage.setItem("kaida-skin", b.dataset.skin); } catch (e) { /* 忽略 */ } }));
  // ---------- 語言切換 ----------
  const I18N = window.KAIDA_I18N;
  const isEn = () => I18N && I18N.lang === "en";
  const L = (zh, en) => (isEn() ? en : zh);
  document.querySelectorAll(".lang button").forEach((b) => (b.onclick = () => I18N.set(b.dataset.lang, render)));
  const ICON = `<svg role="img" aria-label="Kaida 圖示" width="28" height="28" style="display:block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#f2ece1"/><defs><clipPath id="cs-foot"><rect x="0" y="14" width="100" height="72"/></clipPath></defs><g clip-path="url(#cs-foot)"><path d="M13.5 96 V68 H36 V48 H58 V30 H68" fill="none" style="stroke:#2a2620" stroke-width="11" stroke-linejoin="miter"/><circle cx="77" cy="23" r="9" style="fill:#9a7440"/></g></svg>`;
  document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = ICON));
  document.querySelectorAll("[data-logo]").forEach((el) => (el.innerHTML = LOGO));

  // ---------- top bar ----------
  const NAV = [["", "首頁"], ["works", "作品"], ["store", "商店"], ["ideas", "點子區"], ["submit", "提交作品"], ["map", "產品地圖"]];
  function renderTop() {
    const cur = route().name;
    const navKey = cur === "work" || cur === "feedback" ? "works" : cur;
    document.getElementById("nav").innerHTML = NAV.map(([k, l]) => `<a href="#${k || "home"}" ${navKey === (k || "home") ? 'aria-current="page"' : ""}>${l}</a>`).join("");
    const isT = S.user && S.user.tester;
    const who = document.getElementById("whoami");
    // 主要入口是「登入」，成為測試者放在登入流程裡；登入後還不是測試者才另外顯示
    who.innerHTML = `${!S.user ? `<button class="nav-cta" id="login">登入</button>` : isT ? "" : `<a class="nav-cta" href="#tester" ${cur === "tester" ? 'aria-current="page"' : ""}>成為測試者</a>`}
      ${S.user ? `<a class="me" href="#account" ${cur === "account" ? 'aria-current="page"' : ""} title="我的帳號"><span class="avatar" aria-hidden="true">${esc(S.user.name.slice(0, 1))}</span>${esc(S.user.name)}${isT ? '<span class="me-tag">測試者</span>' : ""}${S.user.creator ? '<span class="me-tag">創作者</span>' : ""}</a><button class="btn small ghost" id="logout">登出</button>`
        : ""}`;
    const li = who.querySelector("#login"); if (li) li.onclick = () => needLogin(render);
    const lo = who.querySelector("#logout"); if (lo) lo.onclick = () => { S.user = null; save(); toast("已登出"); render(); };
  }

  // ---------- routing ----------
  function route() {
    const h = decodeURIComponent(location.hash.slice(1)) || "home";
    const [name, id] = h.split(".");
    return { name: name || "home", id };
  }
  function go(hash) { if (location.hash === "#" + hash) render(); else location.hash = hash; }

  function render() {
    const r = route();
    renderTop();
    const pages = { home: pHome, works: pWorks, store: pStore, work: pWork, feedback: pFeedback, submit: pSubmit, ideas: pIdeas, tester: pTester, map: pMap, account: pAccount };
    (pages[r.name] || pHome)(r.id);
    window.scrollTo(0, 0);
  }

  // ---------- 卡片 ----------
  function card(w) {
    let meta;
    if (w.stage === "idea") meta = `<span>找創作者中</span><span>${esc(w.author)}</span>`;
    else if (w.stage === "funding") meta = `<span>募資 <b class="num">${pct(w.funding.raised, w.funding.goal)}%</b> · 剩 <span class="num">${w.funding.daysLeft}</span> 天</span><span>封測 <span class="num">${w.beta.completed}</span> 人完成</span>`;
    else meta = `<span>封測 <b class="num">${w.beta.completed}/${w.beta.target}</b></span><span>${w.beta.avgRating ? "★ <span class=\"num\">" + w.beta.avgRating.toFixed(1) + "</span>" : "尚無評分"}</span>`;
    const bar = w.stage === "beta" ? `<div class="mini-bar" aria-hidden="true"><i style="width:${pct(w.beta.completed, w.beta.target)}%"></i></div>`
      : w.stage === "funding" ? `<div class="mini-bar" aria-hidden="true"><i style="width:${pct(w.funding.raised, w.funding.goal)}%;background:var(--signal-2)"></i></div>` : "";
    return `<a class="card" href="#work.${w.id}">
        <div class="top">${stagePill(w.stage)}${w.live ? `<span class="live-tag">可試用</span>` : ""}<span class="mono-tools">${w.tools.length ? esc(w.tools.join(" + ")) : "尚未開工"}</span></div>
        ${track(w.stage, false)}
        ${catLine(w)}
        <h3>${esc(w.name)}</h3>
        <p class="tag">${esc(w.tagline)}</p>
        ${bar}
        <div class="meta">${meta}</div>
      </a>`;
  }

  // ---------- 首頁 ----------
  function pHome() {
    const ws = allWorks();
    const featured = ws.filter((w) => w.featured);
    const needTesters = ws.filter((w) => w.stage === "beta" && w.beta.completed < w.beta.target);
    const hw = ws.find((w) => w.id === "invoice-cat");
    const fails = hw.health.filter((h) => h.status === "fail").length;
    $app.innerHTML = `<div class="page" style="gap:56px">
      <section class="hero">
        <div class="copy">
          <span class="eyebrow">給台灣 vibe coding 創作者</span>
          <h1>從開工，<br><span class="to">到</span>達成。</h1>
          <p class="lead">點子在這裡發表，作品在這裡封測，有人氣的專案在這裡募資，然後真的做出來交給支持者。Threads 負責熱度，開達負責把事情做完。</p>
          <div class="btn-row"><a class="btn primary" href="#submit">提交作品</a><a class="btn" href="#tester">成為測試者</a></div>
          <div class="etym"><span><b>開</b>開工・開測・開募</span><span><b>達</b>達標・達成・送達</span></div>
        </div>
        <a class="board" href="#work.${hw.id}" aria-label="範例專案：${esc(hw.name)}">
          <div class="head"><div><h3>${esc(hw.name)}</h3><div class="small muted">${esc(hw.author)} · ${esc(hw.tools.join(" + "))}</div></div>${stagePill(hw.stage)}</div>
          ${track(hw.stage, true)}
          <div class="stats3">
            <div><b>${hw.beta.completed}<span class="muted" style="font-size:13px">/${M.rules.minTesters}</span></b><span>封測完成</span></div>
            <div><b>${hw.beta.avgRating.toFixed(1)}</b><span>測試者評分</span></div>
            <div><b style="color:var(--pass)">${fails}</b><span>健檢未通過</span></div>
          </div>
          <div class="progress" id="funding">
            <div class="row"><span class="num" style="font-weight:600">${money(hw.funding.raised)}</span><span class="small muted">目標 ${money(hw.funding.goal)} · <span class="num">${pct(hw.funding.raised, hw.funding.goal)}%</span></span></div>
            <div class="bar"><i style="width:${pct(hw.funding.raised, hw.funding.goal)}%"></i></div>
          </div>
          <div class="small muted">撥款 <span class="num">40% → 40% → 20%</span>，做到哪撥到哪 · 示範資料</div>
        </a>
      </section>

      ${S.user ? (() => {
        const rec = recommended(ws).slice(0, 6);
        if (!interests().length) return `<section class="notice info rec-ask"><span>告訴我們你對什麼有興趣，首頁就會推薦相關作品。</span><button class="btn small primary" id="pick-int">選擇興趣</button></section>`;
        return `<section class="page" style="gap:16px">
          <div class="section-head"><h2>為你推薦</h2><a href="#account" class="small">調整興趣 →</a></div>
          <div class="chips">${interests().map((k) => { const [c, sb] = k.split("."); return `<span class="chip">${esc(subName(catOf(c), sb))}</span>`; }).join("")}</div>
          ${rec.length ? `<div class="grid">${rec.map(card).join("")}</div>` : `<div class="empty">你選的類型還沒有作品，先看看其他精選吧。</div>`}
        </section>`;
      })() : ""}

      <section class="flow" aria-label="四個階段">
        <div class="flow-step"><span class="k">01 點子</span><h3>開工</h3>
          <p>發表點子，概要公開、細節只給成員看，並記錄發表時間。不會寫程式的人也能找創作者一起做。</p></div>
        <div class="flow-step"><span class="k">02 封測</span><h3>開測</h3>
          <p>照任務試用、填結構化回饋。AI 健檢同步檢查能不能開、有沒有外洩金鑰、手機好不好用。</p>
          <span class="gate">門檻：≥${M.rules.minTesters} 人完成任務，健檢無未通過</span></div>
        <div class="flow-step"><span class="k">03 發布</span><h3>上架</h3>
          <p>固定的作品頁和封測紀錄，不會兩天就被洗掉。一鍵產生 Threads 分享卡，把熱度帶回來。</p></div>
        <div class="flow-step"><span class="k">04 募資</span><h3>達成</h3>
          <p>回饋型、全有或全無。達標後依里程碑分批撥款；沒達標全額退款。</p>
          <span class="gate">撥款 40% → 40% → 20%</span></div>
      </section>

      <section class="page" style="gap:16px">
        <div class="section-head"><h2>精選作品</h2><a href="#works" class="small">看全部作品 →</a></div>
        <div class="grid">${featured.map(card).join("")}</div>
      </section>

      ${needTesters.length ? `<section class="page" style="gap:16px">
        <div class="section-head"><h2>正在找測試者</h2><a href="#tester" class="small">成為測試者 →</a></div>
        <div class="grid">${needTesters.map(card).join("")}</div>
      </section>` : ""}
    </div>`;
    const pk = $app.querySelector("#pick-int"); if (pk) pk.onclick = () => askInterests(render);
  }

  // ---------- 商店（照 store-license/設計提案.md：開達當授權中心、用開達登入、付款前同意排除鑑賞期） ----------
  const isPaid = (p) => p.type !== "free";
  function planPrice(p) {
    if (p.type === "free") return "免費";
    if (p.type === "once") return `${money(p.price)} 買斷`;
    return `${money(p.price)}／${p.months === 12 ? "年" : p.months === 1 ? "月" : p.months + " 個月"}`;
  }
  function priceSummary(w) {
    const ps = w.store.plans;
    const paid = ps.filter(isPaid);
    if (!paid.length) return "免費";
    const min = Math.min(...paid.map((p) => p.price));
    return ps.some((p) => !isPaid(p)) ? `免費・付費 ${money(min)} 起` : planPrice(paid[0]);
  }
  const listed = (w) => !!w.store && (w.stage === "launched" || w.stage === "funding");
  function addMonths(d, m) { const x = new Date(d); x.setMonth(x.getMonth() + m); return x.toISOString().slice(0, 10); }

  function storeCard(w) {
    const own = S.owned[w.id];
    return `<a class="card" href="#work.${w.id}">
        <div class="top"><span class="price-tag ${w.store.plans.some(isPaid) ? "paid" : "free"}">${esc(priceSummary(w))}</span><span class="mono-tools">${esc(w.tools.join(" + "))}</span></div>
        ${catLine(w)}
        <h3>${esc(w.name)}</h3>
        <p class="tag">${esc(w.tagline)}</p>
        <div class="trust small"><span>✓ ${w.beta.completed} 位封測完成</span><span>✓ 健檢通過</span>${w.funded ? `<span>✓ 募資已交付</span>` : ""}</div>
        <div class="meta"><span>★ <span class="num">${w.beta.avgRating.toFixed(1)}</span> · <span class="num">${w.store.users.toLocaleString("en-US")}</span> 人使用</span><span>${own ? "<b>已擁有</b>" : esc(w.author)}</span></div>
      </a>`;
  }

  let storeFilter = "all";
  const storeCat = { cat: "all", sub: "all" };
  function pStore() {
    const ws = allWorks().filter(listed);
    const list = ws.filter((w) => storeFilter === "all" || (storeFilter === "free" ? w.store.plans.some((p) => !isPaid(p)) : w.store.plans.some(isPaid))).filter((w) => matchCat(w, storeCat));
    const mine = ws.filter((w) => S.owned[w.id]);
    $app.innerHTML = `<div class="page">
      <header class="detail-head">
        <span class="eyebrow">Kaida Store</span>
        <h1 style="font-size:36px">商店</h1>
        <p class="muted" style="max-width:40em">通過封測並發布的作品都會上架到這裡。用 Google 登入開達、買一次，之後在作品裡按「用開達登入」就能直接解鎖，不用另外註冊。</p>
      </header>
      ${mine.length ? `<section class="panel"><h2>我的購買 <span class="sub">${mine.length} 個作品</span></h2>
        <ul class="tasks">${mine.map((w) => { const o = S.owned[w.id]; return `<li><span class="req must">${esc(o.label)}</span><span style="flex:1"><a href="#work.${w.id}">${esc(w.name)}</a><span class="small muted">　${o.expires ? "到期日 " + o.expires : "永久使用"}・取得於 ${o.date}</span></span><button class="btn small ghost" data-kl="${w.id}">用開達登入</button></li>`; }).join("")}</ul></section>` : ""}
      ${catFilters(ws, storeCat)}
      <div class="filters" role="group" aria-label="依價格篩選">
        ${[["all", "全部"], ["free", "免費"], ["paid", "付費"]].map(([k, l]) => `<button class="filter" data-sf="${k}" aria-pressed="${storeFilter === k}">${l}</button>`).join("")}
      </div>
      ${list.length ? `<div class="grid">${list.map(storeCard).join("")}</div>` : `<div class="empty">這個分類還沒有作品。</div>`}
      <div class="notice info">早期創作者限時免抽成：現在上架與募資，開達都不收手續費。</div>
      <p class="small muted">商店只開放給已公開發布、通過封測與健檢的網頁作品。付款由持牌金流業者處理，開達不經手款項（示範用，不會實際收款）。</p>
    </div>`;
    $app.querySelectorAll("[data-sf]").forEach((b) => (b.onclick = () => { storeFilter = b.dataset.sf; pStore(); }));
    bindCatFilters(storeCat, pStore);
    $app.querySelectorAll("[data-kl]").forEach((b) => (b.onclick = () => kaidaLogin(getWork(b.dataset.kl))));
  }

  function storePanel(w) {
    if (!listed(w)) return "";
    const own = S.owned[w.id];
    return `<section class="panel" id="store">
      <h2>商店 <span class="sub">${w.store.users.toLocaleString("en-US")} 人使用</span></h2>
      ${own ? `<div class="notice info">你已擁有「${esc(own.label)}」${own.expires ? `，到期日 ${own.expires}` : "，永久使用"}。</div>
        <div class="btn-row"><a class="btn primary" href="${esc(w.url)}" target="_blank" rel="noopener">前往使用</a><button class="btn ghost" data-kl="${w.id}">模擬：在作品裡用開達登入</button></div>`
      : `<div class="rewards">${w.store.plans.map((p) => `<div class="reward"><div class="row"><b>${esc(p.label)}</b><span class="p">${planPrice(p)}</span></div>
          <div><button class="btn small ${isPaid(p) ? "primary" : ""}" data-buy="${p.id}">${isPaid(p) ? "購買" : "免費取得"}</button></div></div>`).join("")}</div>`}
      <p class="small muted">買完用同一個 Google 帳號登入作品就會自動解鎖。最後更新 ${esc(w.store.updated)}。</p>
    </section>`;
  }

  function grant(w, p) {
    S.owned[w.id] = { plan: p.id, label: p.label, date: today(), expires: p.type === "term" ? addMonths(today(), p.months) : null };
    save();
  }
  function buy(w, planId) {
    const p = w.store.plans.find((x) => x.id === planId);
    needLogin(() => {
      if (!isPaid(p)) { grant(w, p); toast("已加入我的購買"); pWork(w.id); return; }
      dialog(`<h2>購買「${esc(w.name)}」</h2>
        <div class="row" style="display:flex;justify-content:space-between;gap:8px"><span>${esc(p.label)}</span><b class="num">${planPrice(p)}</b></div>
        <div class="field"><span class="label">付款方式</span><div class="checks-in">${["信用卡", "LINE Pay", "超商代碼"].map((m, i) => `<label><input type="radio" name="pm" ${i === 0 ? "checked" : ""}> ${m}</label>`).join("")}</div></div>
        <label class="task-check" style="display:block"><span style="display:flex;gap:10px;align-items:flex-start;font-size:14px"><input type="checkbox" id="agree" style="margin-top:5px"> 我同意付款後立即提供數位內容，並了解因此不適用七天鑑賞期。</span></label>
        <div class="notice">示範用，不會實際收款。正式版由持牌金流業者處理付款與退款。</div>
        <div class="btn-row"><button class="btn primary" id="pay" disabled>確認付款（示範）</button><button class="btn ghost" data-close>取消</button></div>`,
        (el, close) => {
          const ag = el.querySelector("#agree"), pay = el.querySelector("#pay");
          ag.onchange = () => (pay.disabled = !ag.checked);
          pay.onclick = () => { grant(w, p); close(); pWork(w.id);
            dialog(`<h2>購買完成</h2><p>「${esc(p.label)}」已經加到你的開達帳號。打開作品後按「用開達登入」，用同一個 Google 帳號就會自動解鎖。</p>
              <div class="btn-row"><button class="btn primary" id="go-kl">模擬：用開達登入作品</button><button class="btn ghost" data-close>稍後</button></div>`,
              (el2, close2) => (el2.querySelector("#go-kl").onclick = () => { close2(); kaidaLogin(w); }));
          };
        });
    });
  }
  // 模擬創作者 app 裡的「用開達登入」同意畫面
  function kaidaLogin(w) {
    const own = S.owned[w.id];
    dialog(`<div style="display:flex;align-items:center;gap:10px"><span data-icon-dlg></span><b>用開達登入</b></div>
      <h2 style="font-size:18px">「${esc(w.name)}」想取得你的：</h2>
      <ul class="gate-list"><li><span class="ok">✓</span><span>暱稱（${esc(S.user ? S.user.name : "小安")}）</span></li><li><span class="ok">✓</span><span>你在這個作品的使用權狀態</span></li>
        <li><label style="display:flex;gap:8px"><input type="checkbox"> 也提供 email（選填）</label></li></ul>
      <p class="small muted">作品只會拿到一組專屬 ID，不會知道你在開達買了哪些其他作品。</p>
      <div class="btn-row"><button class="btn primary" id="allow">允許</button><button class="btn ghost" data-close>取消</button></div>`,
      (el, close) => {
        el.querySelector("[data-icon-dlg]").innerHTML = ICON;
        el.querySelector("#allow").onclick = () => { close(); toast(own ? `已解鎖：${own.label}${own.expires ? "（到 " + own.expires + "）" : ""}` : "已登入，但你還沒有使用權，作品會顯示購買連結"); };
      });
  }

  // ---------- 作品列表 ----------
  let listFilter = { stage: "all", tool: "all", cat: "all", sub: "all" };
  function pWorks() {
    const ws = allWorks();
    const counts = ws.reduce((a, w) => ((a[w.stage] = (a[w.stage] || 0) + 1), a), {});
    const list = ws
      .filter((w) => listFilter.stage === "all" || w.stage === listFilter.stage)
      .filter((w) => listFilter.tool === "all" || w.tools.includes(listFilter.tool))
      .filter((w) => matchCat(w, listFilter))
      .sort((a, b) => M.stages[b.stage].order - M.stages[a.stage].order);
    $app.innerHTML = `<div class="page">
      <div class="section-head"><h1 style="font-size:32px">作品</h1><a class="btn primary small" href="#submit">提交作品</a></div>
      ${catFilters(ws, listFilter)}
      <div class="filters" role="group" aria-label="依階段篩選">
        <button class="filter" data-stage="all" aria-pressed="${listFilter.stage === "all"}">全部 <span class="num">${ws.length}</span></button>
        ${Object.keys(M.stages).map((s) => `<button class="filter" data-stage="${s}" aria-pressed="${listFilter.stage === s}">${stageLabel(s)} <span class="num">${counts[s] || 0}</span></button>`).join("")}
        <select id="tool-filter" aria-label="依使用工具篩選">
          <option value="all">所有工具</option>
          ${M.tools.map((t) => `<option ${listFilter.tool === t ? "selected" : ""}>${t}</option>`).join("")}
        </select>
      </div>
      ${list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<div class="empty">沒有符合的作品。換個篩選條件看看。</div>`}
    </div>`;
    $app.querySelectorAll("[data-stage]").forEach((b) => (b.onclick = () => { listFilter.stage = b.dataset.stage; pWorks(); }));
    $app.querySelector("#tool-filter").onchange = (e) => { listFilter.tool = e.target.value; pWorks(); };
    bindCatFilters(listFilter, pWorks);
  }

  // ---------- 作品詳情 ----------
  function pWork(id) {
    const w = getWork(id);
    if (!w) { $app.innerHTML = `<div class="empty">找不到這個作品。<a href="#works">回作品列表</a></div>`; return; }
    const g = gate(w);
    const isIdea = w.stage === "idea";

    const betaPanel = isIdea ? `<section class="panel" id="beta"><h2>封測</h2>
        <p class="muted">這還是一個點子，還沒有可以試用的版本。創作者做出第一版後，就能在這裡開封測。</p>
        <a class="btn small" href="#ideas">到點子區看看其他點子</a></section>`
      : `<section class="panel" id="beta">
        <h2>封測區 <span class="sub">${w.stage === "beta" ? "進行中" : "已結束"}</span></h2>
        <div class="progress">
          <div class="row"><span><span class="big">${w.beta.completed}</span> <span class="muted">/ ${w.beta.target} 位完成任務</span></span><span class="small muted">已報名 ${w.beta.joined} 位</span></div>
          <div class="bar striped" aria-label="封測進度 ${pct(w.beta.completed, w.beta.target)}%">
            <i style="width:${pct(w.beta.completed, w.beta.target)}%"></i>
            ${w.beta.target !== M.rules.minTesters ? `<span class="tick" style="left:${Math.min(100, (M.rules.minTesters / Math.max(w.beta.target, M.rules.minTesters)) * 100)}%" title="開募資門檻 ${M.rules.minTesters} 人"></span>` : ""}
          </div>
          ${w.beta.target < M.rules.minTesters ? `<p class="small" style="color:var(--warn)">創作者設定的目標 ${w.beta.target} 人低於開募資門檻 ${M.rules.minTesters} 人。</p>` : ""}
        </div>
        <div class="stat-row">
          <div class="stat"><b>${w.beta.avgRating ? w.beta.avgRating.toFixed(1) : "–"}</b><span>平均評分</span></div>
          <div class="stat"><b>${w.beta.bugsReported}</b><span>回報問題</span></div>
          <div class="stat"><b>${w.beta.bugsFixed}</b><span>已修正</span></div>
        </div>
        <div><h3 style="margin-bottom:8px">封測任務</h3>
          <ul class="tasks">${w.tasks.map((t) => `<li><span class="req ${t.required ? "must" : ""}">${t.required ? "必做" : "選做"}</span><span>${esc(t.title)}</span></li>`).join("")}</ul>
        </div>
        ${w.stage === "beta" ? `<div class="btn-row"><a class="btn primary" href="#feedback.${w.id}">參加封測並回報</a>${w.url ? `<a class="btn ghost" href="${esc(w.url)}" target="_blank" rel="noopener">開啟試用連結</a>` : ""}</div>` : ""}
        <div><h3 style="margin-bottom:8px">測試者回饋 <span class="sub">${w.feedback.length} 則</span></h3>
          ${w.feedback.length ? `<div class="feedback-list">${w.feedback.map((f) => fbItem(f, w)).join("")}</div>` : `<div class="empty">還沒有回饋。${w.stage === "beta" ? "成為第一個測試者吧。" : ""}</div>`}
        </div>
      </section>`;

    const healthPanel = isIdea ? "" : `<section class="panel" id="health">
        <h2>AI 健檢結果 <span class="sub">示範資料</span></h2>
        <ul class="checks">${w.health.map((h) => `<li class="${h.status}"><span class="ic" aria-hidden="true">${h.status === "pass" ? "✓" : h.status === "warn" ? "!" : "✕"}</span>
          <span>${esc(h.item)}${h.note ? `<span class="note">${esc(h.note)}</span>` : ""}</span>
          <span class="st">${{ pass: "通過", warn: "注意", fail: "未通過" }[h.status]}</span></li>`).join("")}</ul>
        <p class="small muted">原型沒有真的掃描。正式版會在上架前自動檢查，報告可加購完整版。</p>
      </section>`;

    $app.innerHTML = `<div class="page">
      <nav class="crumb"><a href="#works">作品</a> / ${esc(w.name)}</nav>
      <header class="detail-head">
        <div style="max-width:420px">${track(w.stage, true)}</div>
        ${catLine(w)}
        <h1>${esc(w.name)}</h1>
        <p style="font-size:17px">${esc(w.tagline)}</p>
        <p class="by">${esc(w.author)} · ${esc(w.authorNote || "")}</p>
      </header>
      <div class="detail-layout">
        <div class="page" style="gap:16px">
          ${isIdea ? "" : `<div class="shots" aria-label="截圖">${[0, 1, 2].map((i) => shotSVG(w, i)).join("")}</div>`}
          <section class="panel"><h2>介紹</h2><p>${esc(w.description)}</p>
            <dl class="kv">
              <dt>使用工具</dt><dd><div class="chips">${w.tools.map((t) => `<span class="chip">${esc(t)}</span>`).join("") || "尚未開發"}</div></dd>
              <dt>試用連結</dt><dd>${w.url ? `<a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.url)}</a> ${w.live ? `<span class="live-tag">真實可試用</span>` : `<span class="small muted">（示範網址）</span>`}` : "尚無"}</dd>
            </dl>
          </section>
          ${betaPanel}
          ${healthPanel}
          ${fundingPanel(w, g)}
        </div>
        <aside class="side">
          ${storePanel(w)}
          ${w.owner ? creatorTools(w, g) : ""}
          ${isIdea ? "" : sharePanel(w)}
        </aside>
      </div>
    </div>`;
    bindWork(w, g);
  }

  function fbItem(f, w) {
    const req = w.tasks.filter((t) => t.required).map((t) => t.id);
    const done = req.every((r) => f.tasksDone.includes(r));
    return `<article class="fb">
      <div class="h"><span><b>${esc(f.tester)}</b> · ${esc(f.level)}</span><span>${esc(f.date)}</span></div>
      <div class="h"><span class="stars" aria-label="${f.rating} 分">${stars(f.rating)}</span>
        <span>完成 ${f.tasksDone.length}/${w.tasks.length} 項任務${done ? "（必做全完成）" : ""}</span></div>
      ${f.issue ? `<p><span class="sev ${f.severity}">${sevLabel[f.severity]}</span> ${esc(f.issue)}</p>` : `<p><span class="sev none">沒遇到問題</span></p>`}
      <div class="h"><span>${esc(f.device)}</span><span>${payLabel[f.pay] || ""}${f.shot ? " · 附截圖 1 張" : ""}</span></div>
    </article>`;
  }

  function fundingPanel(w, g) {
    if (w.stage === "idea") return "";
    if (w.funded) {
      return `<section class="panel" id="funding"><h2>募資 <span class="sub">已完成</span></h2>
        <div class="notice info">募資成功 ${money(w.funded.raised)}，${w.funded.backers} 位支持者。${w.funded.milestonesDone}/3 個里程碑已交付並撥款，支持者已用開達登入取得回饋。</div></section>`;
    }
    if (w.stage !== "funding") {
      return `<section class="panel" id="funding">
        <h2>募資 <span class="sub">尚未開放</span></h2>
        <p class="muted small">通過封測門檻並公開發布後，創作者才能開啟募資。目前狀態：</p>
        <ul class="gate-list">${g.items.map((i) => `<li><span class="${i.ok ? "ok" : "no"}" aria-hidden="true">${i.ok ? "✓" : "✕"}</span><span>${esc(i.text)}</span></li>`).join("")}</ul>
        ${g.ok ? `<p class="small">已達開募資門檻。${w.stage === "launched" ? "創作者還沒有開啟募資。" : ""}</p>` : ""}
      </section>`;
    }
    const f = w.funding;
    const p = Math.round((f.raised / f.goal) * 100);
    const reached = f.raised >= f.goal;
    return `<section class="panel" id="funding">
      <h2>募資 <span class="sub">回饋型 · 全有或全無</span></h2>
      <div class="notice">示範用，不會實際收款。所有金額、支持者人數皆為假資料。</div>
      <p class="small muted">早期創作者限時免抽成，募資成功的金額全部依里程碑撥給創作者。</p>
      <div class="progress">
        <div class="row"><span class="big">${money(f.raised)}</span><span class="num" style="font-weight:700">${p}%</span></div>
        <div class="bar"><i style="width:${Math.min(100, p)}%"></i></div>
        <div class="row small muted"><span>目標 ${money(f.goal)}</span><span>${f.backers} 位支持者 · 剩 ${f.daysLeft} 天</span></div>
      </div>
      <div class="notice ${reached ? "info" : ""}" style="${reached ? "" : "border-color:var(--line);background:var(--sunk)"}">
        ${reached ? `已達標。募資結束後款項由合作的價金保管機構保管，依下方里程碑分批撥給創作者。` : `還差 ${money(f.goal - f.raised)}。若 ${f.daysLeft} 天後沒有達標，所有支持者全額退款，創作者拿不到任何款項。`}
      </div>

      <div><h3 style="margin-bottom:6px">封測數據</h3>
        <div class="stat-row">
          <div class="stat"><b>${w.beta.completed}</b><span>位測試者完成</span></div>
          <div class="stat"><b>${w.beta.avgRating.toFixed(1)}</b><span>平均評分</span></div>
          <div class="stat"><b>${w.beta.bugsFixed}/${w.beta.bugsReported}</b><span>問題已修</span></div>
        </div>
        <p class="small muted" style="margin-top:6px"><a href="#" data-jump="beta">看完整封測回饋</a> · <a href="#" data-jump="health">看 AI 健檢</a></p>
      </div>

      <div><h3 style="margin-bottom:2px">里程碑撥款</h3>
        <p class="small muted">做到哪撥到哪。每個里程碑都有支持者看得到的成果，達成後才撥下一筆。</p>
        <ol class="milestones">${M.rules.milestones.map((m, i) => `<li><span class="pct">${m.pct}%</span><div><div class="t">${m.title} · ${money((f.goal > f.raised ? f.goal : f.raised) * m.pct / 100)}</div><div class="d">${m.desc}</div><div class="small" style="color:${i < f.milestonesDone ? "var(--pass)" : "var(--muted)"}">${i < f.milestonesDone ? "已撥款" : "未撥款"}</div></div></li>`).join("")}</ol>
      </div>

      <div><h3 style="margin-bottom:6px">如果專案沒做完</h3>
        <ul class="gate-list small">
          <li><span aria-hidden="true">•</span><span>沒達標：全額退款。</span></li>
          <li><span aria-hidden="true">•</span><span>創作者每 ${M.rules.updateEveryDays} 天要更新進度，連續未更新就暫停撥款並通知支持者。</span></li>
          <li><span aria-hidden="true">•</span><span>中途失敗：尚未撥出的款項依比例退還；創作者需交付現有版本或公開原始碼。</span></li>
        </ul>
      </div>

      <div><h3 style="margin-bottom:6px">回饋方案</h3>
        <div class="rewards">${f.rewards.map((r, i) => `<div class="reward">
          <div class="row"><span class="p">${money(r.price)}</span><span class="small muted">${r.backers} 人支持${r.left != null ? ` · 剩 ${r.left} 份` : ""}</span></div>
          <b>${esc(r.title)}</b><span class="small muted">${esc(r.desc)}</span>
          <div><button class="btn small primary" data-back="${i}">支持這個方案</button></div></div>`).join("")}</div>
      </div>

      ${f.updates && f.updates.length ? `<div><h3 style="margin-bottom:6px">進度更新</h3>
        <ul class="gate-list small">${f.updates.map((u) => `<li><span class="num muted">${esc(u.date)}</span><span>${esc(u.title)}</span></li>`).join("")}</ul></div>` : ""}
    </section>`;
  }

  function shareText(w) {
    if (isEn()) return shareTextEn(w);
    const link = `https://（開達網域待定）/w/${w.id}`;
    if (w.stage === "funding") {
      return `我做的「${w.name}」正在募資，目前 ${pct(w.funding.raised, w.funding.goal)}%（${money(w.funding.raised)} / ${money(w.funding.goal)}），${w.funding.backers} 位支持者，剩 ${w.funding.daysLeft} 天。\n\n募資前做過封測：${w.beta.completed} 位測試者完成任務，平均 ${w.beta.avgRating.toFixed(1)} 分。沒達標會全額退款。\n\n${link}\n#vibecoding #台灣創作者`;
    }
    if (w.stage === "beta") {
      return `「${w.name}」正在找封測夥伴！${w.tagline}\n\n目前 ${w.beta.completed}/${w.beta.target} 位完成任務，任務大約 10 分鐘，回饋會直接幫我修 bug。\n\n${link}\n#vibecoding #找測試者`;
    }
    return `「${w.name}」正式發布了！${w.tagline}\n\n${w.beta.completed} 位測試者一起封測過，平均 ${w.beta.avgRating ? w.beta.avgRating.toFixed(1) : "–"} 分。\n\n${link}\n#vibecoding #台灣創作者`;
  }
  function shareTextEn(w) {
    const t = I18N.tr, link = `https://(Kaida domain TBD)/w/${w.id}`, name = t(w.name), tag = t(w.tagline);
    if (w.stage === "funding") {
      return `My project "${name}" is raising funds: ${pct(w.funding.raised, w.funding.goal)}% so far (NT$${w.funding.raised.toLocaleString()} / NT$${w.funding.goal.toLocaleString()}), ${w.funding.backers} backers, ${w.funding.daysLeft} days left.\n\nIt went through a beta first: ${w.beta.completed} testers finished the tasks, average rating ${w.beta.avgRating.toFixed(1)}. Full refund if the goal isn't met.\n\n${link}\n#vibecoding #TaiwanMakers`;
    }
    if (w.stage === "beta") {
      return `"${name}" is looking for beta testers! ${tag}\n\n${w.beta.completed}/${w.beta.target} testers have finished so far. The tasks take about 10 minutes, and your feedback goes straight into fixing bugs.\n\n${link}\n#vibecoding #betatesters`;
    }
    return `"${name}" is officially live! ${tag}\n\n${w.beta.completed} testers helped beta test it, average rating ${w.beta.avgRating ? w.beta.avgRating.toFixed(1) : "–"}.\n\n${link}\n#vibecoding #TaiwanMakers`;
  }
  function sharePanel(w) {
    const isF = w.stage === "funding";
    const val = isF ? pct(w.funding.raised, w.funding.goal) : pct(w.beta.completed, w.beta.target);
    const line = isF ? `募資 ${val}% · ${money(w.funding.raised)}` : `封測 ${w.beta.completed}/${w.beta.target} 人完成`;
    return `<section class="panel" id="share">
      <h2>Threads 分享卡 <span class="sub">預覽</span></h2>
      <div class="share-card" aria-label="分享圖卡預覽">
        <div class="sc-top">${LOGO}<span class="sc-stage">${stageLabel(w.stage)}</span></div>
        <div><div class="sc-name">${esc(w.name)}</div><div class="sc-tag">${esc(w.tagline)}</div></div>
        <div class="sc-stat"><span>${line}</span><div class="sc-bar"><i style="width:${val}%"></i></div><span style="opacity:.7">by ${esc(w.author)}</span></div>
      </div>
      <label class="small" for="share-text" style="font-weight:600">貼文文字範本</label>
      <textarea id="share-text" class="share-text">${esc(shareText(w))}</textarea>
      <div class="btn-row"><button class="btn small dark" id="copy-share">複製文字</button></div>
      <p class="small muted">原型只做預覽。正式版要產生可下載的圖片，並把連結預覽圖設成這張卡。</p>
    </section>`;
  }

  function creatorTools(w, g) {
    const canLaunch = w.stage === "beta" && g.ok;
    const canFund = w.stage === "launched" && g.ok;
    return `<section class="creator-tools" aria-label="創作者示範工具">
      <h3>你是這個作品的創作者</h3>
      <p class="small muted">下面是給原型用的模擬按鈕，用來快速看到封測達標後的畫面。</p>
      ${w.stage === "beta" ? `<div class="btn-row">
        <button class="btn small ghost" data-sim="1">模擬 1 位測試者完成</button>
        <button class="btn small ghost" data-sim="5">模擬 5 位</button>
        <button class="btn small ghost" id="sim-fix">模擬：修好健檢問題</button></div>` : ""}
      <ul class="gate-list small">${g.items.map((i) => `<li><span class="${i.ok ? "ok" : "no"}">${i.ok ? "✓" : "✕"}</span><span>${esc(i.text)}</span></li>`).join("")}</ul>
      ${w.stage === "beta" ? `<button class="btn primary" id="do-launch" ${canLaunch ? "" : "disabled"}>公開發布</button>` : ""}
      ${w.stage === "launched" ? `<button class="btn primary" id="do-fund" ${canFund ? "" : "disabled"}>開啟募資</button>` : ""}
      ${w.stage === "funding" ? `<p class="small">募資進行中。</p>` : ""}
      ${(w.stage === "launched" || w.stage === "funding") ? (w.store ? `<p class="small">已上架商店：${esc(priceSummary(w))}</p>` : `<button class="btn" id="do-store">上架到商店</button>`) : ""}
    </section>`;
  }

  function bindWork(w, g) {
    $app.querySelectorAll("[data-jump]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); document.getElementById(a.dataset.jump).scrollIntoView({ behavior: "smooth" }); }));
    const copy = $app.querySelector("#copy-share");
    if (copy) copy.onclick = () => {
      const ta = $app.querySelector("#share-text");
      const fallback = () => { ta.focus(); ta.select(); toast("已選取文字，請按複製"); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(() => toast("已複製貼文文字"), fallback);
      else fallback();
    };
    $app.querySelectorAll("[data-back]").forEach((b) => (b.onclick = () => {
      const r = w.funding.rewards[+b.dataset.back];
      dialog(`<h2>支持「${esc(r.title)}」</h2>
        <p class="big num" style="font-size:24px;font-weight:700">${money(r.price)}</p>
        <div class="notice">示範用，不會實際收款。正式版會導到合作的金流／價金保管服務付款。</div>
        <p class="small muted">若募資未達標，這筆款項會全額退回。</p>
        <div class="btn-row"><button class="btn primary" id="dlg-back">模擬支持</button><button class="btn ghost" data-close>取消</button></div>`,
        (el, close) => (el.querySelector("#dlg-back").onclick = () => needLogin(() => {
          patch(w.id, "funding", { raised: w.funding.raised + r.price, backers: w.funding.backers + 1 });
          close(); toast("已模擬支持，沒有實際扣款"); pWork(w.id);
        })));
    }));
    $app.querySelectorAll("[data-sim]").forEach((b) => (b.onclick = () => {
      const n = +b.dataset.sim;
      patch(w.id, "beta", { completed: w.beta.completed + n, joined: Math.max(w.beta.joined, w.beta.completed + n), avgRating: w.beta.avgRating || 4.2 });
      pWork(w.id);
    }));
    const fix = $app.querySelector("#sim-fix");
    if (fix) fix.onclick = () => { patch(w.id, "top", {}); S.patches[w.id].health = w.health.map((h) => ({ item: h.item, status: h.status === "fail" ? "pass" : h.status, note: h.status === "fail" ? "已修正（模擬）" : h.note })); save(); pWork(w.id); };
    const launch = $app.querySelector("#do-launch");
    if (launch) launch.onclick = () => { patch(w.id, "top", { stage: "launched" }); toast("已公開發布"); pWork(w.id); };
    $app.querySelectorAll("[data-buy]").forEach((b) => (b.onclick = () => buy(w, b.dataset.buy)));
    $app.querySelectorAll("[data-kl]").forEach((b) => (b.onclick = () => kaidaLogin(w)));
    const st = $app.querySelector("#do-store");
    if (st) st.onclick = () => dialog(`<h2>上架到商店</h2>
      <p class="small muted">第一版只賣網頁作品。付款由持牌金流分帳，款項直接撥給你。早期創作者限時免抽成。</p>
      <div class="field"><label for="st-type">方案</label><select id="st-type" class="input"><option value="free">免費</option><option value="once">一次買斷</option><option value="term">一年方案</option></select></div>
      <div class="field" id="st-price-f" hidden><label for="st-price">價格（新台幣）</label><input id="st-price" type="number" min="30" value="490"></div>
      <div class="btn-row"><button class="btn primary" id="dlg-store">上架</button><button class="btn ghost" data-close>取消</button></div>`,
      (el, close) => {
        const ty = el.querySelector("#st-type");
        ty.onchange = () => (el.querySelector("#st-price-f").hidden = ty.value === "free");
        el.querySelector("#dlg-store").onclick = () => {
          const t = ty.value, price = Math.max(30, +el.querySelector("#st-price").value || 490);
          const plan = t === "free" ? { id: "free", type: "free", label: "免費使用", price: 0 } : t === "once" ? { id: "once", type: "once", label: "一次買斷", price } : { id: "term", type: "term", label: "一年方案", price, months: 12 };
          patch(w.id, "top", { store: { plans: [plan], users: 0, updated: today() } });
          close(); toast("已上架到商店"); pWork(w.id);
        };
      });
    const fund = $app.querySelector("#do-fund");
    if (fund) fund.onclick = () => dialog(`<h2>開啟募資</h2>
      <p class="small muted">示範設定。里程碑撥款比例由平台固定為 40% / 40% / 20%。</p>
      <div class="field"><label for="f-goal">目標金額（新台幣）</label><input id="f-goal" type="number" min="10000" step="1000" value="100000"></div>
      <div class="field"><label for="f-days">募資天數</label><input id="f-days" type="number" min="7" max="60" value="30"></div>
      <div class="field"><label for="f-rw">回饋方案（名稱）</label><input id="f-rw" type="text" value="搶先版一年"></div>
      <div class="field"><label for="f-rp">回饋方案（金額）</label><input id="f-rp" type="number" min="100" value="490"></div>
      <div class="btn-row"><button class="btn primary" id="dlg-fund">開始募資</button><button class="btn ghost" data-close>取消</button></div>`,
      (el, close) => (el.querySelector("#dlg-fund").onclick = () => {
        const goal = Math.max(10000, +el.querySelector("#f-goal").value || 100000);
        patch(w.id, "top", { stage: "funding" });
        S.patches[w.id].funding = { goal, raised: 0, backers: 0, daysLeft: +el.querySelector("#f-days").value || 30, milestonesDone: 0,
          rewards: [{ price: +el.querySelector("#f-rp").value || 490, title: el.querySelector("#f-rw").value || "搶先版", desc: "創作者自訂回饋", left: null, backers: 0 }],
          updates: [{ date: today(), title: "募資開跑" }] };
        save(); close(); toast("募資已開啟（示範）"); pWork(w.id);
      }));
  }

        <div class="btn-row"><button class="btn primary" type="submit">送出回饋</button><a class="btn ghost" href="#work.${w.id}">取消</a></div>
      </form></div>`;
    const form = $app.querySelector("#fb-form");
    form.querySelectorAll("[data-r]").forEach((b) => (b.onclick = () => {
      rating = +b.dataset.r;
      form.querySelectorAll("[data-r]").forEach((x) => { const on = +x.dataset.r <= rating; x.classList.toggle("on", on); x.setAttribute("aria-checked", String(+x.dataset.r === rating)); });
    }));
    let shot = null;
    form.querySelector("#fb-shot").onchange = (e) => {
      const file = e.target.files[0]; if (!file) return;
      const rd = new FileReader();
      rd.onload = () => { const im = form.querySelector("#shot-prev"); im.src = rd.result; im.hidden = false; shot = file.name; };
      rd.readAsDataURL(file);
    };
    const sevSel = form.querySelector("#fb-sev");
    const syncSev = () => (form.querySelector("#issue-field").style.opacity = sevSel.value === "none" ? ".55" : "1");
    sevSel.onchange = syncSev; syncSev();
    form.onsubmit = (e) => {
      e.preventDefault();
      const tasksDone = [...form.querySelectorAll('[name="task"]:checked')].map((x) => x.value);
      const sev = sevSel.value, issue = form.querySelector("#fb-issue").value.trim();
      const errs = { task: !tasksDone.length, issue: sev !== "none" && !issue, rate: !rating };
      Object.entries(errs).forEach(([k, bad]) => (form.querySelector("#err-" + k).hidden = !bad));
      form.querySelector("#fb-issue").setAttribute("aria-invalid", String(errs.issue));
      if (Object.values(errs).some(Boolean)) { toast("還有欄位需要補上"); return; }
      const fb = { tester: S.user.name, level: S.user.tester ? "新手測試者" : "一般會員", rating, tasksDone, issue, severity: sev,
        device: form.querySelector("#fb-device").value, date: today(), pay: form.querySelector('[name="pay"]:checked').value, shot, more: form.querySelector("#fb-more").value.trim() };
      (S.feedback[w.id] = S.feedback[w.id] || []).unshift(fb);
      const reqDone = w.tasks.filter((t) => t.required).every((t) => tasksDone.includes(t.id));
      const n = w.feedback.length;
      const newAvg = ((w.beta.avgRating || 0) * Math.max(n, w.beta.completed) + rating) / (Math.max(n, w.beta.completed) + 1);
      patch(w.id, "beta", { completed: w.beta.completed + (reqDone ? 1 : 0), joined: w.beta.joined + 1, avgRating: Math.round(newAvg * 10) / 10, bugsReported: w.beta.bugsReported + (sev !== "none" ? 1 : 0) });
      toast(reqDone ? "已送出，你已算進封測完成人數" : "已送出。必做任務沒全做完，暫不算完成人數");
      go("work." + w.id);
    };
  }

    mk = "fd-arrow-t";
    const tall = `<svg class="fd fd-tall" viewBox="0 0 360 620" role="img" aria-label="${L("AI 創作者流程圖", "AI creator flow diagram")}">${defs()}
      ${node(0, 40, 10, 200, 44)}${node(1, 40, 80, 200, 44)}${node(2, 40, 150, 200, 44)}${node(3, 40, 220, 200, 44, " hot")}
      ${node(4, 262, 220, 92, 44, " hot small")}${gate(140, 322, 32)}${node(5, 40, 384, 200, 44)}
      ${node(6, 16, 466, 156, 44, " goal")}${node(7, 188, 466, 156, 44, " goal")}${node(8, 40, 556, 200, 44, " goal")}
      ${ar("M140 54 V78")}${ar("M140 124 V148")}${ar("M140 194 V218")}${ar("M140 264 V288")}
      ${ar("M140 354 V382")}${lab(148, 372, L("是", "yes"), "start")}
      ${ar("M172 322 H300 V266")}${lab(232, 314, L("否", "no"))}
      ${ar("M262 242 H242")}
      ${ar("M140 428 V446 H94 V464")}${ar("M140 428 V446 H266 V464")}
      ${ar("M94 510 V532 H140 V554")}${ar("M266 510 V532 H140")}
      ${ar("M240 578 H357 V242 H356", " loop")}${lab(296, 608, L("新的回饋 → 下一版", "feedback → next"))}
    </svg>`;
    return `<figure class="fd-wrap">${wide}${tall}<figcaption class="small muted">${L("實線是主流程，虛線是上線後的回饋回到下一版。", "Solid lines are the main path; the dashed line is post-launch feedback flowing into the next version.")}</figcaption></figure>`;
  }
  function pMap() {
    const steps = FLOW.map((f, i) => `<li class="cf-step">

        <div>${L(r[5], r[6])}</div>

      </div>`).join("");
    $app.innerHTML = `<div class="page map-page">
      <header class="detail-head"><h1 style="font-size:32px">${L("產品地圖", "Product map")}</h1>
        <p class="muted">${L("開達為什麼存在、一位 AI 創作者在這裡從點子走到交付的完整流程，以及接下來要做什麼。", "Why Kaida exists, the full path an AI creator takes here from idea to delivery, and what we build next.")}</p></header>
      <section class="origin">
        <span class="k">${L("創作初衷", "WHY WE STARTED")}</span>
        <h2>${L("好作品，不該沒人看見。", "Good work shouldn't go unseen.")}</h2>
        ${L(`<p>開達來自一位剛畢業大學生的突發奇想。</p>
        <p>在這個 AI 大時代，做出一個作品從來沒有這麼容易，被看見卻越來越難。很多人已經有能力做出好東西，卻因為沒有追蹤數、沒有管道，作品貼出去兩天就被沖掉。好作品沒有得到有效的關注，是不是很可惜呢？</p>
        <p>我們也相信，好產品不是一次就做對，而是一版一版迭代出來的。所以開達把這條路鋪成看得見的步驟：先讓真實的人試用、留下回饋，跟著回饋修改，夠好了再發布、上架或募資，最後把承諾交付給支持你的人。</p>
        <p><b>讓認真做出來的東西，被認真看見。</b></p>`,
        `<p>Kaida started as a sudden idea from a fresh university graduate.</p>
        <p>In this age of AI, making something has never been easier, yet getting it seen keeps getting harder. Plenty of people can now build good things, but without followers or a channel, their work is buried two days after they post it. Isn't it a shame when good work never gets real attention?</p>
        <p>We also believe good products are rarely right the first time. They get better one iteration at a time. So Kaida lays the path out as visible steps: real people try your work and leave feedback, you improve it from that feedback, and when it's ready you launch, list it in the store or raise funds, then deliver what you promised to the people who backed you.</p>
        <p><b>Work made with care deserves to be seen with care.</b></p>`)}
        <span class="sign">— ${L("開達 Kaida", "Kaida")}</span>
      </section>
      <section class="page" style="gap:14px">
        <div class="section-head"><h2>${L("AI 創作者的完整流程", "The full journey of an AI creator")}</h2></div>
        <p class="muted">${L("從一個想法，到有人付費使用、真正交付。每一步都寫了你要做的事，以及開達在那一步幫你什麼。", "From an idea to people paying for it and getting it delivered. Each step shows what you do and how Kaida helps.")}</p>
        ${flowDiagram()}
        <ol class="cflow">${steps}</ol>
        <p class="loop">${L("第 4、5 步會來回好幾輪：封測沒過門檻就改完再測。上架或募資之後收到的回饋，也會回到第 5 步，變成下一版。", "Steps 4 and 5 loop several times: if a beta misses the gate, fix it and test again. Feedback after launch or funding also goes back to step 5 and becomes the next version.")}</p>
      </section>
      <section class="page" style="gap:14px">
        <h2>${L("路線圖", "Roadmap")}</h2>
        <div class="road">${road}</div>
        <p class="small muted">${L("時間與數字都是待驗證的假設。", "Timelines and numbers are assumptions still to be tested.")}</p>
      </section>
    </div>`;
  }

  // ---------- 我的帳號：可以隨時修改興趣 ----------
  function pAccount() {
    if (!S.user) { $app.innerHTML = `<div class="page"><h1 style="font-size:32px">我的帳號</h1><div class="empty">登入後才能看帳號設定。<br><br><button class="btn primary" id="lg">用示範帳號登入</button></div></div>`;
      $app.querySelector("#lg").onclick = () => needLogin(render); return; }
    const owned = Object.keys(S.owned).length;
    $app.innerHTML = `<div class="page">
      <header class="detail-head"><h1 style="font-size:32px">我的帳號</h1>
        <p class="muted">${esc(S.user.name)} · 已購買 ${owned} 個作品</p></header>
      <section class="panel"><h2>身分</h2>
        <div class="role-opts">
          <label class="tester-opt"><input type="checkbox" data-role="tester" ${S.user.tester ? "checked" : ""}><span><b>測試者</b><span class="small muted">接封測任務、填回饋。</span></span></label>
          <label class="tester-opt"><input type="checkbox" data-role="creator" ${S.user.creator ? "checked" : ""}><span><b>創作者</b><span class="small muted">提交作品、上架商店、開募資。</span></span></label>
        </div></section>
      <section class="panel"><h2>我的興趣 <span class="sub"><span class="num" id="int-n">${interests().length}</span> 項已選</span></h2>
        <p class="small muted">勾選你想看的類型，首頁的「為你推薦」會依這裡排序。</p>
        <form id="int-form">${interestPicker(interests())}
          <div class="btn-row" style="margin-top:14px"><button class="btn primary" type="submit">儲存興趣</button><button class="btn ghost" type="button" id="int-clear">全部取消</button></div></form>
      </section>
    </div>`;
    $app.querySelectorAll("[data-role]").forEach((x) => (x.onchange = () => { S.user[x.dataset.role] = x.checked; save(); renderTop(); toast("身分已更新"); }));
    const f = $app.querySelector("#int-form");
    f.onchange = () => ($app.querySelector("#int-n").textContent = readPicker(f).length);
    $app.querySelector("#int-clear").onclick = () => { f.querySelectorAll('[name="interest"]').forEach((x) => (x.checked = false)); f.onchange(); };
    f.onsubmit = (e) => { e.preventDefault(); S.user.interests = readPicker(f); S.user.onboarded = true; save(); toast("興趣已更新"); go("home"); };
  }

  // ---------- 成為測試者 ----------
  function pTester() {
    const beta = allWorks().filter((w) => w.stage === "beta");
    const isT = S.user && S.user.tester;
    const step1 = S.user
      ? `<div class="t-step done"><span class="t-n">1</span><div><b>已登入：<span>${esc(S.user.name)}</span></b><span class="small muted">興趣可以在<a href="#account">我的帳號</a>修改。</span></div></div>`
      : `<div class="t-step"><span class="t-n">1</span><div class="t-login"><b>登入開達</b>
          <span class="small muted">成為測試者要先登入。登入視窗裡的「成為測試者」預設已勾選，登入就完成了。</span>
          <button class="btn primary" id="t-login">登入並成為測試者</button></div></div>`;
    const step2 = isT ? `<div class="t-step done"><span class="t-n">2</span><div><b>你已經是測試者了</b><span class="small muted">從下面挑一個作品開始吧。</span></div></div>`
      : `<div class="t-step${S.user ? "" : " off"}"><span class="t-n">2</span><div style="display:grid;gap:14px;min-width:0"><b>填測試者資料</b>
        ${S.user ? `<form class="form" id="t-form" novalidate>
        <div class="field"><label for="t-name">暱稱</label><input id="t-name" type="text" value="${esc(S.user.name)}"></div>
        <div class="field"><span class="label">你有的裝置</span><div class="checks-in">${["iPhone", "Android 手機", "Windows 電腦", "Mac", "平板"].map((d) => `<label><input type="checkbox" name="dev" value="${d}"> ${d}</label>`).join("")}</div></div>
        <div class="field"><label for="t-time">每週大概能花多少時間</label><select id="t-time" class="input"><option>30 分鐘以內</option><option selected>1 小時左右</option><option>2 小時以上</option></select></div>
        <div class="btn-row"><button class="btn primary" type="submit">加入測試者</button></div>
      </form>` : `<span class="small muted">登入後就能填。</span>`}</div></div>`;
    $app.innerHTML = `<div class="page">
      <header class="detail-head"><h1 style="font-size:32px">成為測試者</h1>
        <p class="muted">搶先試用台灣創作者的新作品，照任務試用、填寫回饋。回饋品質好，等級會提升，之後可換點數或互測額度（獎勵方式待定）。</p></header>
      <div class="form-shell t-steps">${step1}${step2}</div>
      <section class="page" style="gap:14px"><h2>正在封測的作品</h2><div class="grid">${beta.map(card).join("")}</div></section>
    </div>`;
    const lg = $app.querySelector("#t-login"); if (lg) lg.onclick = () => needLogin(() => {});
    const f = $app.querySelector("#t-form");
    if (f) f.onsubmit = (e) => { e.preventDefault(); Object.assign(S.user, { name: f.querySelector("#t-name").value.trim() || S.user.name, tester: true }); save(); toast("歡迎加入測試者"); render(); };
  }

  document.getElementById("reset").onclick = () => {
    dialog(`<h2>清除示範資料？</h2><p class="muted">會清掉你在這個瀏覽器新增的作品、回饋、點子與登入狀態，回到初始假資料。</p>
      <div class="btn-row"><button class="btn primary" id="dlg-reset">清除</button><button class="btn ghost" data-close>取消</button></div>`,
      (el, close) => (el.querySelector("#dlg-reset").onclick = () => { S = blank(); save(); close(); toast("已清除"); go("home"); }));
  };

  // 重新整理：重新載入整個網頁（會再播一次進場動畫），你新增的資料仍保留
  document.getElementById("reload").onclick = () => location.reload();
  // 換頁時關掉還開著的對話框
  window.addEventListener("hashchange", () => document.querySelectorAll(".dialog-back").forEach((d) => d.remove()));
  window.addEventListener("hashchange", render);
  if (I18N) { I18N.start(); I18N.set(I18N.lang, render); } else render();

  // ---------- 進場動畫：字型與頁面資源都載完、球落到階梯頂端才進入 ----------
  (function splash() {
    const el = document.getElementById("splash");
    if (!el) return;
    const loaded = new Promise((res) => (document.readyState === "complete" ? res() : window.addEventListener("load", res, { once: true })));
    const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    const timeout = new Promise((res) => setTimeout(res, 8000));
    const ready = Promise.race([Promise.all([loaded, fonts]), timeout]);
    // 進度條：頁面、字型各佔一段，完成就往前跳；等待中慢慢往目前上限爬，載完跑到 100%
    // 進度條借用封測的樣子：20 位測試者完成就是 100%，跑滿顯示通過門檻
    const barEl = el.querySelector(".sp-bar i"), pctEl = el.querySelector(".sp-pct"), labEl = el.querySelector(".sp-label");
    let done = 0.15, shown = 0, full = false;
    loaded.then(() => (done += 0.35)); fonts.then(() => (done += 0.4));
    ready.then(() => (full = true));
    (function tick() {
      if (!el.isConnected) return;
      const target = full ? 1 : Math.min(0.95, done + (1 - done) * 0.5);
      shown += (target - shown) * (full ? 0.25 : 0.06);
      if (full && 1 - shown < 0.004) shown = 1;
      barEl.style.transform = `scaleX(${shown.toFixed(3)})`;
      pctEl.textContent = Math.round(shown * 100) + "%";
      const n = Math.floor(shown * 20 + 1e-6);
      labEl.textContent = n >= 20 ? L("封測通過，準備發布", "Beta passed, launching") : L(`封測 ${n}/20 位完成`, `Beta ${n}/20 testers done`);
      if (shown < 1) requestAnimationFrame(tick);
    })();
    const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    const line = el.querySelector(".sp-stairs");
    let isReady = false, arrived = false, finished = false;
    const finish = () => {
      if (finished) return; finished = true;
      el.classList.add("done"); document.documentElement.classList.remove("splashing");
      setTimeout(() => el.remove(), 360);
    };
    // redraw：線剛好收掉時才載好，就先從底部重畫一次再讓球落下
    const arrive = (redraw) => {
      if (arrived) return; arrived = true;
      el.classList.add("arrived"); if (redraw) el.classList.add("redraw");
      setTimeout(finish, still ? 150 : redraw ? 1150 : 800);
    };
    // 載好時看線畫到哪：正在畫就等它畫滿、已畫滿就直接落球、正在收就等下一輪重畫
    const CYCLE = 900, FULL = 450, HOLD_END = 675;
    ready.then(() => {
      isReady = true;
      if (still) return arrive(false);
      const a = line.getAnimations && line.getAnimations()[0];
      const t = a && a.currentTime != null ? a.currentTime % CYCLE : FULL;
      if (t < FULL) setTimeout(() => arrive(false), FULL - t);
      else if (t <= HOLD_END) arrive(false);
    });
    line.addEventListener("animationiteration", () => { if (isReady) arrive(true); });
    setTimeout(() => { arrive(false); setTimeout(finish, 1300); }, 9000);
  })();
})();
