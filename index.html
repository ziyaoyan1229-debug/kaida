<style>
/* 開達 Kaida（開工到達成）原型樣式。
   Layout: 單欄內容流（最寬 1120px）＋頂部導覽；作品詳情寬螢幕為主欄＋側欄。
   兩套風格，各自是刻意的單一外觀，不跟系統深淺色切換：
   - 米色極簡（預設）：米紙底、墨色字、黃銅色進度，細線、直角、大量留白。
   - Cyber（data-skin="cyber"）：深夜底、網格、青色霓虹＋洋紅，切角面板與發光。 */
:root {
  --paper: #f2ece1;
  --surface: #f8f4ec;
  --sunk: #ebe3d5;
  --ink: #2a2620;
  --muted: #7d7365;
  --line: #ddd2c0;
  --accent: #2a2620;        /* 主要按鈕底色 */
  --accent-ink: #f8f4ec;    /* 主要按鈕文字 */
  --signal: #9a7440;        /* 進度、達成點：黃銅 */
  --signal-2: #2a2620;      /* 募資 */
  --accent-text: #86632f;
  --idea: #8f8577;
  --beta: #9a7440;
  --launched: #5b7150;
  --funding: #2a2620;
  --pass: #5b7150;
  --warn: #a5772a;
  --fail: #a6463a;
  --focus: #9a7440;
  --logo-accent: #9a7440;
  --card-bg: #2a2620; --card-fg: #f2ece1; --card-accent: #c9a36a; --card-track: rgba(242, 236, 225, .18);
  --glow: none;
  --grid: none;
  --shadow: none;
  --r: 2px;
  --clip: none;

  --f-display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --h-weight: 500;
  --h-track: .01em;
  color-scheme: light;
}
:root[data-skin="cyber"] {
  --paper: #07080d;
  --surface: #0c1018;
  --sunk: #131a27;
  --ink: #e8f1ff;
  --muted: #7f8ca8;
  --line: #1e2840;
  --accent: #22e8ff;
  --accent-ink: #03141a;
  --signal: #22e8ff;
  --signal-2: #ff3ea5;
  --accent-text: #22e8ff;
  --idea: #8693ad;
  --beta: #22e8ff;
  --launched: #7cffb2;
  --funding: #ff3ea5;
  --pass: #7cffb2;
  --warn: #ffd23e;
  --fail: #ff5470;
  --focus: #ff3ea5;
  --logo-accent: #22e8ff;
  --card-bg: #0c1018; --card-fg: #e8f1ff; --card-accent: #22e8ff; --card-track: rgba(34, 232, 255, .15);
  --glow: 0 0 16px rgba(34, 232, 255, .55);
  --grid: linear-gradient(rgba(34, 232, 255, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 232, 255, .05) 1px, transparent 1px);
  --shadow: 0 0 0 1px rgba(34, 232, 255, .08), 0 20px 50px -30px rgba(255, 62, 165, .45);
  --r: 0px;
  --clip: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));

  --f-display: "Chakra Petch", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --h-weight: 700;
  --h-track: .04em;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background-color: var(--paper); background-image: var(--grid); background-size: 28px 28px;
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
img, svg { max-width: 100%; }
h1, h2, h3 { font-family: var(--f-display); font-weight: var(--h-weight); letter-spacing: var(--h-track); line-height: 1.3; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 6vw, 48px); }
h2 { font-size: 22px; }
h3 { font-size: 17px; }
p { margin: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---- top bar ---- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 10px 18px; min-height: 60px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand svg { height: 24px; width: auto; display: block; }
.brand .zh { font-size: 13px; color: var(--muted); letter-spacing: .2em; padding-left: 10px; border-left: 1px solid var(--line); }
.nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
.nav a { text-decoration: none; padding: 6px 10px; color: var(--muted); font-size: 14px; border-bottom: 1px solid transparent; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
.tools-bar { display: flex; align-items: center; gap: 8px; }
.whoami { display: flex; align-items: center; gap: 8px; }
.nav-cta { font-weight: 700; font-size: 14px; text-decoration: none; padding: 6px 14px; background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: var(--r); box-shadow: var(--glow); white-space: nowrap; }
.nav-cta:hover { transform: translateY(-1px); }
.nav-cta[aria-current="page"] { outline: 2px solid var(--signal); outline-offset: 2px; }
.me { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.avatar { width: 24px; height: 24px; display: grid; place-items: center; background: var(--ink); color: var(--paper); font-size: 12px; border-radius: 50%; }
:root[data-skin="cyber"] .avatar { border-radius: 0; background: var(--signal); color: var(--accent-ink); }
.me-tag { font-size: 11px; font-weight: 500; font-family: var(--f-mono); color: var(--signal); border: 1px solid currentColor; padding: 0 5px; border-radius: var(--r); }
.whoami select { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.skin { display: inline-flex; border: 1px solid var(--line); padding: 2px; gap: 2px; background: var(--surface); border-radius: var(--r); }
.skin button { border: 0; background: transparent; color: var(--muted); font: 500 12px var(--f-mono); letter-spacing: .06em; padding: 4px 10px; cursor: pointer; border-radius: var(--r); }
.skin button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
@media (max-width: 420px) { .skin button { padding: 4px 7px; } .tools-bar { gap: 4px; flex-wrap: wrap; justify-content: flex-end; row-gap: 6px; min-width: 0; } .nav-cta { padding: 6px 10px; } }
@media (max-width: 720px) {
  .nav { order: 3; width: 100%; margin-left: 0; overflow-x: auto; flex-wrap: nowrap; }
  .nav a { white-space: nowrap; }
  .tools-bar { margin-left: auto; }
  .brand .zh { display: none; }
}

.demo-strip { color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
.demo-strip .wrap { padding-block: 5px; font-family: var(--f-mono); letter-spacing: .02em; }

main { padding-block: 32px 72px; }
.page { display: grid; gap: 32px; }

/* ---- buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: inherit; font-weight: 500; font-size: 15px; padding: 10px 20px; border-radius: var(--r);
  border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; text-decoration: none;
  transition: transform .15s, box-shadow .15s, background-color .15s;
}
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: var(--glow); }
.btn.dark { background: var(--ink); color: var(--paper); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn.ghost { border-color: var(--line); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---- 階段軌道（點子 → 封測 → 發布 → 募資 → 交付） ---- */
.track { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; }
.track i { height: 4px; background: var(--line); }
.track i.on { background: var(--ink); }
.track i.now { background: var(--signal); box-shadow: var(--glow); }
.track-names { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; font-size: 11px; color: var(--muted); margin-top: 4px; }
.track-names .cur { color: var(--ink); font-weight: 600; }

/* ---- hero ---- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 48px; align-items: center; padding-block: 16px 8px; }
.hero h1 { font-size: clamp(40px, 7vw, 76px); line-height: 1.12; font-weight: var(--h-weight); }
.hero h1 .to { color: var(--signal); }
.hero p.lead { font-size: 17px; max-width: 30em; color: var(--muted); }
.hero .copy { display: grid; gap: 22px; }
.etym { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.etym b { color: var(--ink); font-weight: 600; margin-right: 6px; }
.board { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 16px; box-shadow: var(--shadow); clip-path: var(--clip); text-decoration: none; color: inherit; }
.board .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.board h3 { font-size: 22px; }
.board .stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-block: 1px solid var(--line); padding-block: 12px; gap: 8px; }
.board .stats3 b { display: block; font-family: var(--f-mono); font-size: 20px; font-weight: 600; }
.board .stats3 span { font-size: 12px; color: var(--muted); }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: 28px; } }

.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--ink); }
.flow-step { padding: 18px 20px 4px 0; display: grid; gap: 8px; align-content: start; }
.flow-step + .flow-step { padding-left: 20px; border-left: 1px solid var(--line); }
.flow-step .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.flow-step h3 { font-size: 24px; }
.flow-step p { font-size: 14px; color: var(--muted); }
.flow-step .gate { font-size: 12px; margin-top: 4px; padding-left: 10px; border-left: 2px solid var(--signal); }
@media (max-width: 860px) {
  .flow { grid-template-columns: 1fr 1fr; row-gap: 20px; }
  .flow-step:nth-child(3) { padding-left: 0; border-left: 0; }
}
@media (max-width: 480px) {
  .flow { grid-template-columns: 1fr; }
  .flow-step, .flow-step + .flow-step { padding: 16px 0 0; border-left: 0; }
  .flow-step + .flow-step { border-top: 1px solid var(--line); }
}

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 26px; }

/* ---- stage pill ---- */
.stage { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--ink); }
.stage::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.stage.idea { color: var(--idea); }
.stage.beta { color: var(--beta); }
.stage.launched { color: var(--launched); }
.stage.funding { color: var(--funding); }
:root[data-skin="cyber"] .stage { font-family: var(--f-mono); letter-spacing: .04em; }
:root[data-skin="cyber"] .stage::before { border-radius: 0; box-shadow: 0 0 8px currentColor; }

/* ---- work cards ---- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; align-content: start; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s, box-shadow .15s; clip-path: var(--clip); min-width: 0; }
.card:hover { border-color: var(--ink); transform: translateY(-2px); }
:root[data-skin="cyber"] .card:hover { border-color: var(--signal); box-shadow: var(--shadow); }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .mono-tools { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.card h3 { font-size: 21px; }
.card .tag { font-size: 14px; color: var(--muted); min-height: 3.4em; }
.card .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.card .meta b { color: var(--ink); font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); color: var(--ink); font-family: var(--f-mono); border-radius: var(--r); }
.mini-bar { height: 3px; background: var(--line); overflow: hidden; }
.mini-bar > i { display: block; height: 100%; background: var(--signal); box-shadow: var(--glow); }

.price-tag { font-size: 12px; font-weight: 700; font-family: var(--f-mono); padding: 1px 8px; border: 1px solid var(--ink); border-radius: var(--r); }
.price-tag.free { border-color: var(--launched); color: var(--launched); }
.trust { display: flex; gap: 4px 12px; flex-wrap: wrap; color: var(--pass); }

/* ---- filters ---- */
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filter { font: inherit; font-size: 14px; padding: 5px 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; border-radius: var(--r); }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filters select { font: inherit; font-size: 14px; padding: 5px 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r); }

/* ---- detail ---- */
.crumb { font-size: 13px; color: var(--muted); font-family: var(--f-mono); }
.crumb a { text-decoration: none; }
.detail-head { display: grid; gap: 10px; }
.detail-head .by { color: var(--muted); font-size: 14px; }
.detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
.detail-layout > * { min-width: 0; }
.side { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); }
@media (max-width: 900px) {
  .detail-layout { grid-template-columns: 1fr; }
  .side { position: static; }
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 16px; clip-path: var(--clip); }
.panel > h2 { font-size: 19px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.panel .sub { font-size: 12px; color: var(--muted); font-family: var(--f-mono); font-weight: 400; letter-spacing: .04em; }
.shots { display: grid; grid-auto-flow: column; grid-auto-columns: 46%; gap: 12px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; }
.shots svg { scroll-snap-align: start; border: 1px solid var(--line); width: 100%; height: auto; display: block; border-radius: var(--r); }
@media (min-width: 640px) { .shots { grid-auto-columns: 30%; } }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.progress { display: grid; gap: 8px; }
.progress .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.progress .big { font-family: var(--f-mono); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.bar { height: 8px; background: var(--sunk); overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; background: var(--signal); transition: width .4s; box-shadow: var(--glow); }
.bar.striped > i { background: repeating-linear-gradient(90deg, var(--signal) 0 10px, color-mix(in srgb, var(--signal) 70%, var(--paper)) 10px 12px); }
.bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
#funding .bar > i { background: var(--signal-2); }
:root[data-skin="cyber"] #funding .bar > i { box-shadow: 0 0 14px var(--signal-2); }

.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.tasks li { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tasks .req { font-size: 11px; font-family: var(--f-mono); padding: 0 6px; border: 1px solid var(--muted); color: var(--muted); white-space: nowrap; margin-top: 2px; border-radius: var(--r); }
.tasks .req.must { border-color: var(--ink); color: var(--ink); }

.feedback-list { display: grid; gap: 10px; }
.fb { border: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 6px; font-size: 14px; border-radius: var(--r); background: var(--paper); }
.fb .h { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.fb .h b { color: var(--ink); }
.sev { font-size: 11px; font-weight: 600; padding: 1px 6px; color: var(--paper); border-radius: var(--r); }
.sev.critical { background: var(--fail); }
.sev.major { background: var(--warn); }
.sev.minor { background: var(--muted); }
.sev.none { background: var(--launched); }
.stars { color: var(--signal); letter-spacing: 1px; }

.checks { list-style: none; margin: 0; padding: 0; display: grid; }
.checks li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.checks li:last-child { border-bottom: 0; }
.checks .ic { width: 18px; height: 18px; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--paper); margin-top: 2px; border-radius: 50%; }
:root[data-skin="cyber"] .checks .ic { border-radius: 0; }
.checks .pass .ic { background: var(--pass); }
.checks .warn .ic { background: var(--warn); }
.checks .fail .ic { background: var(--fail); }
.checks .st { font-size: 12px; font-weight: 600; font-family: var(--f-mono); }
.checks .pass .st { color: var(--pass); }
.checks .warn .st { color: var(--warn); }
.checks .fail .st { color: var(--fail); }
.checks .note { display: block; font-size: 12px; color: var(--muted); }

.notice { border-left: 3px solid var(--signal-2); background: var(--sunk); padding: 8px 12px; font-size: 13px; }
.notice.info { border-left-color: var(--launched); }
.notice.bad { border-left-color: var(--fail); }

.gate-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.gate-list li { display: flex; gap: 8px; align-items: flex-start; }
.gate-list .ok { color: var(--pass); font-weight: 800; }
.gate-list .no { color: var(--fail); font-weight: 800; }

.milestones { list-style: none; margin: 0; padding: 0; display: grid; }
.milestones li { display: grid; grid-template-columns: 58px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.milestones li:last-child { border-bottom: 0; }
.milestones .pct { font-family: var(--f-mono); font-weight: 600; font-size: 22px; }
.milestones .t { font-weight: 600; font-size: 14px; }
.milestones .d { font-size: 13px; color: var(--muted); }

.rewards { display: grid; gap: 10px; }
.reward { border: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 4px; border-radius: var(--r); background: var(--paper); }
.reward .p { font-family: var(--f-mono); font-weight: 600; font-size: 18px; }
.reward .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }

.stat-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-block: 1px solid var(--line); }
.stat { padding: 10px 12px 10px 0; }
.stat + .stat { padding-left: 12px; border-left: 1px solid var(--line); }
.stat b { display: block; font-family: var(--f-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

/* ---- share card ---- */
.share-card {
  aspect-ratio: 1 / 1; max-width: 100%; width: 100%; padding: 22px; display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
  background: var(--card-bg); color: var(--card-fg); position: relative; overflow: hidden; border-radius: var(--r); clip-path: var(--clip);
}
:root[data-skin="cyber"] .share-card { border: 1px solid var(--signal); background-image: var(--grid); background-size: 22px 22px; }
.share-card .sc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }
.share-card .sc-top svg { height: 16px; width: auto; color: var(--card-fg); --logo-accent: var(--card-accent); }
.share-card .sc-stage { border: 1px solid var(--card-accent); color: var(--card-accent); font-family: var(--f-mono); padding: 0 8px; }
.share-card .sc-name { font-family: var(--f-display); font-size: clamp(26px, 7vw, 34px); font-weight: var(--h-weight); line-height: 1.2; align-self: end; }
.share-card .sc-tag { font-size: 14px; opacity: .78; margin-top: 6px; }
.share-card .sc-stat { font-family: var(--f-mono); font-size: 13px; display: grid; gap: 6px; }
.share-card .sc-bar { height: 4px; background: var(--card-track); overflow: hidden; }
.share-card .sc-bar i { display: block; height: 100%; background: var(--card-accent); box-shadow: var(--glow); }
textarea.share-text { width: 100%; min-height: 150px; font: inherit; font-size: 14px; padding: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); resize: vertical; border-radius: var(--r); }

/* ---- forms ---- */
.form { display: grid; gap: 20px; max-width: 720px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .label { font-weight: 500; font-size: 14px; }
.field .hint { font-size: 12px; color: var(--muted); }
.field .err { font-size: 12px; color: var(--fail); }
input[type="text"], input[type="url"], input[type="number"], textarea, select.input {
  font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); width: 100%; border-radius: var(--r);
}
input:focus, textarea:focus, select:focus { border-color: var(--ink); outline: none; }
:root[data-skin="cyber"] input:focus, :root[data-skin="cyber"] textarea:focus { border-color: var(--signal); box-shadow: var(--glow); }
textarea { min-height: 96px; resize: vertical; }
input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--fail); }
.checks-in { display: flex; flex-wrap: wrap; gap: 6px; }
.checks-in label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; padding: 6px 12px; border: 1px solid var(--line); cursor: pointer; border-radius: var(--r); }
.checks-in label:has(input:checked) { border-color: var(--ink); background: var(--sunk); }
.task-check { display: grid; gap: 6px; }
.task-check label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); font-size: 14px; cursor: pointer; border-radius: var(--r); }
.task-check label:has(input:checked) { border-color: var(--launched); }
.task-editor { display: grid; gap: 6px; }
.task-editor .row { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; }
.task-editor .row label { font-size: 13px; display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--signal); }
.rating { display: flex; gap: 4px; }
.rating button { font: inherit; font-size: 26px; line-height: 1; background: none; border: 0; cursor: pointer; color: var(--line); padding: 2px; }
.rating button.on { color: var(--signal); }
.locked-tag { font-size: 11px; font-family: var(--f-mono); padding: 0 6px; border: 1px solid var(--ink); color: var(--ink); border-radius: var(--r); }
.blur { filter: blur(5px); user-select: none; }
.form-shell { background: var(--surface); border: 1px solid var(--line); padding: 26px; border-radius: var(--r); clip-path: var(--clip); }
@media (max-width: 480px) { .form-shell { padding: 18px; } .panel { padding: 18px; } }

/* ---- ideas ---- */
.idea { background: var(--surface); border: 1px solid var(--line); padding: 18px; display: grid; gap: 10px; border-radius: var(--r); clip-path: var(--clip); }
.idea .detail { font-size: 14px; padding: 10px 12px; background: var(--sunk); display: grid; gap: 4px; }
.idea .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

/* ---- toast & dialog ---- */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 18px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); text-align: center; border-radius: var(--r); }
.dialog-back { position: fixed; inset: 0; background: rgba(10, 10, 12, .55); z-index: 40; display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--surface); color: var(--ink); padding: 24px; max-width: 440px; width: 100%; display: grid; gap: 14px; border: 1px solid var(--line); border-radius: var(--r); clip-path: var(--clip); }

.empty { padding: 28px; border: 1px dashed var(--line); text-align: center; color: var(--muted); font-size: 14px; }
.creator-tools { border: 1px dashed var(--ink); padding: 16px; display: grid; gap: 10px; background: var(--surface); }
:root[data-skin="cyber"] .creator-tools { border-color: var(--signal-2); }
.creator-tools h3 { font-size: 15px; }

footer { border-top: 1px solid var(--line); padding-block: 22px; font-size: 13px; color: var(--muted); }

/* Cyber 的額外質感：標題微光、方括號標籤 */
:root[data-skin="cyber"] h1 { text-shadow: 0 0 24px rgba(34, 232, 255, .35); }
:root[data-skin="cyber"] .eyebrow::before { content: "[ "; color: var(--signal); }
:root[data-skin="cyber"] .eyebrow::after { content: " ]"; color: var(--signal); }
:root[data-skin="cyber"] .flow { border-top-color: var(--signal); }
:root[data-skin="cyber"] .nav a[aria-current="page"] { border-bottom-color: var(--signal); color: var(--signal); }
:root[data-skin="cyber"] .skin button[aria-pressed="true"] { background: var(--signal); color: var(--accent-ink); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- 產品地圖 ---------- */
.origin { display: grid; gap: 12px; padding: 26px 28px; border-left: 3px solid var(--signal); background: var(--surface); clip-path: var(--clip); }
.origin .k { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; color: var(--muted); }
.origin h2 { font-size: 22px; }
.origin p { max-width: 40em; line-height: 1.85; }
.origin .sign { font-size: 13px; color: var(--muted); }
.map { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--ink); }
.map-col { padding: 16px 16px 6px 0; display: grid; gap: 10px; align-content: start; min-width: 0; }
.map-col + .map-col { padding-left: 16px; border-left: 1px solid var(--line); }
.map-col .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.map-col h3 { font-size: 20px; }
.map-col .who { font-size: 13px; color: var(--muted); }
.map-col ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
.map-col li { display: flex; gap: 6px; align-items: baseline; }
.map-col li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 7px; background: var(--line); }
.map-col li.on::before { background: var(--signal); }
.map-col .gate { font-size: 12px; padding-left: 10px; border-left: 2px solid var(--signal); color: var(--muted); }
.map-col a.small { justify-self: start; }
.map-legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.map-legend span { display: inline-flex; gap: 6px; align-items: center; }
.map-legend i { width: 8px; height: 8px; background: var(--line); display: inline-block; }
.map-legend i.on { background: var(--signal); }
.loop { font-size: 14px; color: var(--muted); padding: 12px 16px; border: 1px dashed var(--line); }
.road { display: grid; gap: 0; border-top: 1px solid var(--ink); }
.road-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.road-row .ph { display: grid; gap: 2px; }
.road-row .ph b { font-size: 16px; }
.road-row .ph span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.road-row .pass { color: var(--muted); }
.road-row .pass::before { content: attr(data-l); display: block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; }
.road-row.now .ph b::after { content: attr(data-now); margin-left: 8px; font-size: 11px; font-weight: 600; font-family: var(--f-mono); color: var(--accent-ink); background: var(--accent); padding: 1px 6px; border-radius: var(--r); vertical-align: middle; }
@media (max-width: 900px) {
  .map { grid-template-columns: 1fr; border-top: 0; gap: 0; }
  .map-col, .map-col + .map-col { padding: 16px 0; border-left: 0; border-top: 1px solid var(--line); }
  .map-col:first-child { border-top: 1px solid var(--ink); }
}
@media (max-width: 640px) { .road-row { grid-template-columns: 1fr; gap: 6px; } .origin { padding: 20px; } }

/* ---------- 進場動畫：階梯的線往上畫，資源載完後球輕輕落到頂端才進入 ---------- */
html.splashing { overflow: hidden; }
.splash { position: fixed; inset: 0; z-index: 1000; display: grid; justify-content: center; background: var(--paper); color: var(--ink); transition: opacity .32s ease, visibility .32s; animation: sp-fallback 0s 10s forwards; }
:root[data-skin="cyber"] .splash { background-color: var(--paper); background-image: linear-gradient(rgba(34,232,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(34,232,255,.05) 1px, transparent 1px); background-size: 24px 24px; }
.splash.done { opacity: 0; visibility: hidden; pointer-events: none; }
@keyframes sp-fallback { to { opacity: 0; visibility: hidden; pointer-events: none; } }
.splash { grid-template-columns: min(360px, 82vw); align-content: center; row-gap: 0; }
.splash-logo { width: 100%; height: auto; overflow: visible; }
.sp-bar { margin-top: 34px; height: 3px; background: var(--line); overflow: hidden; border-radius: 2px; }
.sp-bar i { display: block; height: 100%; width: 100%; background: var(--signal); transform-origin: left; transform: scaleX(0); }
:root[data-skin="cyber"] .sp-bar { border-radius: 0; }

.sp-dot { fill: var(--signal); opacity: 0; transform: translate(77px, -30px); }

@keyframes sp-draw { to { stroke-dashoffset: 0; } }
@keyframes sp-drop {

  62% { transform: translate(77px, 23px); animation-timing-function: cubic-bezier(.2, .6, .4, 1); }
