// 紋理：石牆、灰泥、木板、瓦片、鵝卵石
const stoneT = tex(512, 512, (g, w, h) => { g.fillStyle = "#6f675c"; g.fillRect(0, 0, w, h); for (let r = 0; r < 8; r++) for (let i = 0; i < 7; i++) { const x = (i + (r % 2) * 0.5) * 74 + (Math.random() - 0.5) * 8, y = r * 64 + (Math.random() - 0.5) * 6, sw = 62 + Math.random() * 10, sh = 52 + Math.random() * 8; g.fillStyle = ["#9a9288", "#8d857a", "#a59d92", "#8a8278", "#b0a89c"][(r * 7 + i) % 5]; g.beginPath(); g.roundRect(x, y, sw, sh, 12); g.fill(); g.fillStyle = "rgba(255,255,255,.12)"; g.beginPath(); g.roundRect(x + 4, y + 4, sw - 8, sh * 0.4, 8); g.fill(); } });
const plasterT = tex(256, 256, (g, w, h) => { g.fillStyle = "#efe4cf"; g.fillRect(0, 0, w, h); for (let i = 0; i < 4000; i++) { g.fillStyle = i % 3 ? "#e6d9c0" : "#f7eedc"; g.globalAlpha = 0.5; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); } g.globalAlpha = 0.15; g.fillStyle = "#c8b89a"; for (let i = 0; i < 30; i++) g.fillRect(Math.random() * w, Math.random() * h, 20 + Math.random() * 40, 2); });

const cobbleT = tex(512, 512, (g, w, h) => { g.fillStyle = "#8d8273"; g.fillRect(0, 0, w, h); for (let r = 0; r < 12; r++) for (let i = 0; i < 12; i++) { const x = (i + (r % 2) * 0.5) * 44 + (Math.random() - 0.5) * 6, y = r * 44 + (Math.random() - 0.5) * 6; g.fillStyle = ["#b3a797", "#a89c8b", "#c1b5a4", "#9f9484"][(r + i) % 4]; g.beginPath(); g.ellipse(x + 20, y + 20, 19, 17, 0, 0, 7); g.fill(); g.fillStyle = "rgba(255,255,255,.14)"; g.beginPath(); g.ellipse(x + 17, y + 15, 10, 7, -0.5, 0, 7); g.fill(); } }, [3, 3]);
const grassT = tex(512, 512, (g, w, h) => { g.fillStyle = "#77a84f"; g.fillRect(0, 0, w, h); for (let i = 0; i < 9000; i++) { g.fillStyle = ["#5f8f3e", "#8fc264", "#a8d178", "#4f7a32", "#6fa347"][i % 5]; g.globalAlpha = 0.55; const x = Math.random() * w, y = Math.random() * h; g.fillRect(x, y, 2, 4 + Math.random() * 5); } }, [8, 8]);
const WIN = new THREE.MeshStandardMaterial({ color: "#2a2018", emissive: "#ffb24e", emissiveIntensity: winGlow, roughness: 0.25, metalness: 0.1 });
const GLASS = new THREE.MeshPhysicalMaterial({ color: "#cfe6ff", roughness: 0.05, metalness: 0, transmission: 0.6, transparent: true, opacity: 0.55, thickness: 0.05 });

function ground(t) { const m = add(new THREE.CircleGeometry(10, 64), new THREE.MeshStandardMaterial({ map: t, roughness: 0.95 }), 0, 0, 0); m.rotation.x = -Math.PI / 2; m.castShadow = false; }
// 一叢叢草：InstancedMesh，隨機分佈，避開房子和小路
function grassTufts(n, col, avoid) {
  const geo = new THREE.ConeGeometry(0.05, 0.22, 4); geo.translate(0, 0.1, 0);
  const im = new THREE.InstancedMesh(geo, mat(col), n); im.receiveShadow = true; const M = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), e = new THREE.Euler();
  let i = 0, tries = 0;
  while (i < n && tries++ < n * 20) { const a = Math.random() * 6.283, r = 1.5 + Math.random() * 7.5; p.set(Math.cos(a) * r, 0, Math.sin(a) * r); if (avoid.some((c) => Math.hypot(p.x - c[0], p.z - c[1]) < c[2])) continue; e.set((Math.random() - 0.5) * 0.4, Math.random() * 6.283, (Math.random() - 0.5) * 0.4); q.setFromEuler(e); s.setScalar(0.7 + Math.random() * 0.8); M.compose(p, q, s); im.setMatrixAt(i++, M); }
  im.count = i; scene.add(im);
}
function flowers(cx, cz, r, n, cols) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, d = Math.random() * r; const x = cx + Math.cos(a) * d, z = cz + Math.sin(a) * d; cyl(0.012, 0.012, 0.22, "#4f7a32", x, 0.11, z, scene, 4); sph(0.045, cols[i % cols.length], x, 0.24, z, scene, 8, 6); } }
function path(w, t) { const p = add(new THREE.PlaneGeometry(w, 5.5), new THREE.MeshStandardMaterial({ map: t, roughness: 0.9, polygonOffset: true, polygonOffsetFactor: -2 }), 0.7, 0.01, 3.3); p.rotation.x = -Math.PI / 2; p.castShadow = false; }
function lamp(x, z) {

  cyl(0.18, 0.22, 0.12, "#2f2b30", 0, 0.06, 0, g, 12); cyl(0.07, 0.1, 0.25, "#2f2b30", 0, 0.24, 0, g, 10); cyl(0.04, 0.06, 1.3, "#2f2b30", 0, 1.0, 0, g, 10);

  box(0.26, 0.03, 0.26, "#2f2b30", 0, 1.66, 0, g); [[-0.11, -0.11], [0.11, -0.11], [-0.11, 0.11], [0.11, 0.11]].forEach(([a, b]) => box(0.02, 0.32, 0.02, "#2f2b30", a, 1.82, b, g));
  add(new THREE.BoxGeometry(0.2, 0.3, 0.2), new THREE.MeshStandardMaterial({ color: "#fff2c8", emissive: "#ffb24a", emissiveIntensity: winGlow * 1.2, roughness: 0.2, transparent: true, opacity: 0.9 }), 0, 1.82, 0, g);

// 炊煙：幾顆慢慢上升變大的半透明球
const smokes = [];
function smoke(x, y, z) { for (let i = 0; i < 7; i++) { const s = sph(0.12, new THREE.MeshStandardMaterial({ color: "#e8e4dc", transparent: true, opacity: 0.35, roughness: 1 }), x, y, z, scene, 10, 8); s.castShadow = false; hideForAO.push(s); smokes.push({ s, x, y, z, t: i / 7 }); } }
// 一排排的瓦片屋頂（兩面斜坡），每片瓦是獨立小幾何，照 rows×cols 排
function tileRoof(g, w, d, h, y, col, col2, rows, cols, kind, over) {

// 木格窗：外框、格條、亮玻璃，可加窗台和窗簾
function latticeWin(g, w, h, x, y, z, ry, cols, rows, frame, sill, curtain) {
