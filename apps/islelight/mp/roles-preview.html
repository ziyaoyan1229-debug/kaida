<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>漂流燈島 多人職業與黑影預覽</title>
<style>html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#111}canvas{display:block}
.lbl{position:fixed;transform:translate(-50%,0);text-align:center;pointer-events:none;white-space:nowrap}
.lbl b{display:inline-block;padding:5px 11px;border-radius:999px;font-size:15px;color:#fff}
.lbl i{display:block;font-style:normal;font-size:12px;margin-top:5px;color:#334}
.seat{position:fixed;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,236,190,.92);color:#1a1408;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 0 14px rgba(255,210,120,.7)}
.me{position:fixed;transform:translate(-50%,0);pointer-events:none;text-align:center}
.me b{display:inline-block;padding:5px 11px;border-radius:999px;font-size:15px;color:#fff}
.me i{display:block;font-style:normal;font-size:12px;margin-top:5px;color:#ffe9b8}
#title{position:fixed;left:24px;top:18px;font-size:22px;font-weight:800}
#sub{position:fixed;left:24px;top:52px;font-size:14px;opacity:.8}</style>
<script type="importmap">{ "imports": { "three": "../../pomodoro/vendor/three.module.min.js", "three/addons/": "../vendor/" } }</script>
</head>
<body>
<div id="title"></div><div id="sub"></div>
<script type="module">
/* 多人模式預覽：?mode=day 白天每個職業（職業道具與標籤只有自己看得到）、?mode=night 晚上別人眼中的黑影、?mode=self 晚上自己的視角 */
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { clone as skClone } from "three/addons/utils/SkeletonUtils.js";
const mode = new URLSearchParams(location.search).get("mode") || "day";
const NIGHT = mode !== "day";
const ROLES = [
  { name: "守燈人", side: "守燈人", model: "Knight", gear: [], color: "#4f8a4a" },
  { name: "守塔人", side: "守燈人", model: "Mage", gear: ["2H_Staff"], color: "#3b6fd1" },
  { name: "藥師", side: "守燈人", model: "Mage", gear: ["Spellbook_open"], color: "#2fa58f", tint: "#9fe0c8" },
  { name: "修燈匠", side: "守燈人", model: "Barbarian", gear: ["1H_Axe"], color: "#c47a22" },
  { name: "獵人", side: "守燈人", model: "Rogue", gear: ["2H_Crossbow"], color: "#7a5a2f" },
  { name: "漂流者", side: "中立", model: "Barbarian", gear: ["Mug"], color: "#8a62c4", tint: "#c8b4f0" },
  { name: "叛徒", side: "叛徒", model: "Rogue_Hooded", gear: ["Knife"], color: "#c43a3a" },
];
const ME = 1; // self 模式下「你」是守塔人
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = NIGHT ? 1.2 : 1.05; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(NIGHT ? "#0b1222" : "#cfe3f2"); scene.fog = new THREE.Fog(scene.background, 14, 30);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
if (!NIGHT) { const sun = new THREE.DirectionalLight("#fff2dc", 2.6); sun.position.set(6, 10, 7); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 10, bottom: -8 }); sun.shadow.bias = -0.0004; scene.add(sun); scene.add(new THREE.HemisphereLight("#dfeeff", "#8a7a60", 0.9)); }
else { scene.add(new THREE.HemisphereLight("#3a4a78", "#0a0c14", 0.35)); const moon = new THREE.DirectionalLight("#8aa4e0", 0.35); moon.position.set(-6, 10, 4); scene.add(moon); }
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: NIGHT ? "#3a5a38" : "#9cc47a", roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
document.getElementById("title").textContent = { day: "白天：每個職業（職業道具和標籤只有自己看得到）", night: "晚上：別人眼中的大家", self: "晚上：你自己的畫面（你是 2 號守塔人）" }[mode];
document.getElementById("sub").textContent = { day: "外觀可以自己挑，不代表職業；別人白天看到你只有外觀，看不到手上的職業道具和標籤", night: "全部變成黑影，只剩座位號碼和提燈光；道具也藏起來，看不出職業", self: "只有你自己是原本的樣子和職業，其他人一律是黑影" }[mode];
["title", "sub"].forEach((id) => document.getElementById(id).style.color = NIGHT ? "#f2e6c8" : "#1b2a40");
function glowTex() { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.3, "rgba(255,220,150,.6)"); gr.addColorStop(1, "rgba(255,200,120,0)"); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); }
const GLOW = glowTex();
const SIL = new THREE.MeshBasicMaterial({ color: "#05060b" });
const loader = new GLTFLoader(); const cache = {}; const mixers = []; const tags = [];
const gap = 1.7; const v = new THREE.Vector3();
(async () => {
  await Promise.all([...new Set(ROLES.map((r) => r.model))].map(async (m) => { cache[m] = await loader.loadAsync("../assets/chars/" + m + ".json"); }));
  ROLES.forEach((r, i) => {
    const x = (i - (ROLES.length - 1) / 2) * gap; const src = cache[r.model]; const model = skClone(src.scene);
    const sil = NIGHT && !(mode === "self" && i === ME);
    model.traverse((o) => {
      if (!o.isMesh) return; o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
      const isGear = /Sword|Shield|Axe|Crossbow|Staff|Wand|Knife|Offhand|Throwable|Spellbook|Mug/.test(o.name) && !/Body|Head|Arm|Leg|Cape|Hat|Helmet/.test(o.name);
      if (isGear) o.visible = !sil && r.gear.includes(o.name) && (!NIGHT || mode === "self");
      if (sil) o.material = SIL; else if (r.tint && !isGear) { o.material = o.material.clone(); o.material.color.multiply(new THREE.Color(r.tint)); }
    });
    model.position.set(x, 0, 0); model.rotation.y = 0.2; scene.add(model);
    const mix = new THREE.AnimationMixer(model); const clip = src.animations.find((a) => a.name === "Idle"); if (clip) { const a = mix.clipAction(clip); a.play(); a.time = i * 0.37; } mixers.push(mix);
    if (NIGHT) { // 提燈：每個人都有，只是光
      const hand = model.getObjectByName("handslot.l") || model.getObjectByName("hand.l");
      const lamp = new THREE.Group(); const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 8), new THREE.MeshBasicMaterial({ color: "#ffd890" })); lamp.add(bulb);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); sp.scale.setScalar(0.9); lamp.add(sp);
      (hand || model).add(lamp); if (!hand) lamp.position.set(0.3, 0.8, 0.2);
      const pl = new THREE.PointLight("#ffc879", 3.2, 3.2, 1.6); pl.position.set(x + 0.25, 0.8, 0.35); scene.add(pl);
    }
    const el = document.createElement("div");
    if (!NIGHT) { el.className = "lbl"; el.innerHTML = `<b style="background:${r.color}">${r.name}</b><i>${r.side}</i>`; tags.push({ el, p: new THREE.Vector3(x, 0, 0.7), dy: 8 }); }
    else if (mode === "self" && i === ME) { el.className = "me"; el.innerHTML = `<b style="background:${r.color}">你・${r.name}</b><i>只有你看得到</i>`; tags.push({ el, p: new THREE.Vector3(x, 0, 0.7), dy: 8 }); }
    else { el.className = "seat"; el.textContent = i + 1; tags.push({ el, p: new THREE.Vector3(x, 2.75, 0), dy: 0 }); }
    document.body.appendChild(el);
  });
  setTimeout(() => window.__ready = true, 600);
})();
const clock = new THREE.Clock();
function frame() {
  const dt = clock.getDelta(); mixers.forEach((m) => m.update(dt));
  const w = (ROLES.length - 1) * gap + 4; camera.position.set(0, 1.9, w * 0.62 + 2.6); camera.lookAt(0, 0.85, 0);
  renderer.render(scene, camera);
  tags.forEach(({ el, p, dy }) => { v.copy(p).project(camera); el.style.left = (v.x * 0.5 + 0.5) * innerWidth + "px"; el.style.top = (-v.y * 0.5 + 0.5) * innerHeight + dy + "px"; });
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
