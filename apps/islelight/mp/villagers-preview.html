<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>漂流燈島 居民外觀預覽</title>
<style>html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#cfe3f2}canvas{display:block}
.lbl{position:fixed;transform:translate(-50%,0);text-align:center;pointer-events:none;white-space:nowrap}
.lbl b{display:inline-block;padding:5px 11px;border-radius:999px;font-size:15px;color:#fff}
.lbl i{display:block;font-style:normal;font-size:12px;margin-top:5px;color:#334}
#title{position:fixed;left:24px;top:18px;font-size:22px;font-weight:800;color:#1b2a40}
#sub{position:fixed;left:24px;top:52px;font-size:14px;color:#1b2a40;opacity:.8}</style>
<script type="importmap">{ "imports": { "three": "../../pomodoro/vendor/three.module.min.js", "three/addons/": "../vendor/" } }</script>
</head>
<body>
<div id="title">居民外觀：白天大家互相看得到的樣子</div>
<div id="sub">進房間時自己挑一套，跟職業無關；每套整身換色＋自己的帽子或配件，遠遠看輪廓就分得出來</div>
<script type="module">
/* 居民外觀：沿用 KayKit 人物骨架與動畫，衣服改成整片純色，原本的帽子盔甲拿掉，換上用簡單幾何做的帽子／配件（綁在頭或身體骨頭上） */
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { clone as skClone } from "three/addons/utils/SkeletonUtils.js";
const M = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85, flatShading: true }, o));
const mesh = (g, m, x, y, z, rx, ry, rz) => { const o = new THREE.Mesh(g, m); o.position.set(x || 0, y || 0, z || 0); o.rotation.set(rx || 0, ry || 0, rz || 0); o.castShadow = true; return o; };
// 帽子與配件（頭骨座標：y 往上、z 往前，頭頂約在 y≈0.95）
const ACC = {
  sou(c) { const g = new THREE.Group(); g.add(mesh(new THREE.SphereGeometry(0.55, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), M(c), 0, 0.72, -0.02)); g.add(mesh(new THREE.CylinderGeometry(0.85, 0.95, 0.06, 14), M(c), 0, 0.74, -0.08, -0.18)); return g; },
  chef() { const g = new THREE.Group(); const w = M("#ffffff"); g.add(mesh(new THREE.SphereGeometry(0.6, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), w, 0, 0.5, -0.02)); g.add(mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.14, 16), w, 0, 0.58, -0.02)); g.add(mesh(new THREE.CylinderGeometry(0.52, 0.56, 0.6, 14), w, 0, 0.98, -0.02)); [[-0.25, 0], [0.25, 0], [0, 0.22], [0, -0.22], [0, 0]].forEach(([x, z]) => g.add(mesh(new THREE.SphereGeometry(0.33, 10, 8), w, x, 1.3, z))); return g; },
  straw() { const g = new THREE.Group(); const s = M("#e8c770"); g.add(mesh(new THREE.CylinderGeometry(0.92, 0.96, 0.05, 18), s, 0, 0.78, 0)); g.add(mesh(new THREE.CylinderGeometry(0.45, 0.52, 0.38, 14), s, 0, 0.98, 0)); g.add(mesh(new THREE.CylinderGeometry(0.53, 0.53, 0.09, 14), M("#d04848"), 0, 0.85, 0)); return g; },
  sailor() { const g = new THREE.Group(); g.add(mesh(new THREE.SphereGeometry(0.6, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), M("#1f3462"), 0, 0.52, -0.02)); g.add(mesh(new THREE.CylinderGeometry(0.74, 0.62, 0.36, 16), M("#ffffff"), 0, 0.92, -0.02)); g.add(mesh(new THREE.CylinderGeometry(0.63, 0.63, 0.1, 16), M("#1f3462"), 0, 0.6, -0.02)); g.add(mesh(new THREE.BoxGeometry(0.62, 0.04, 0.34), M("#111a30"), 0, 0.56, 0.55, 0.25)); g.add(mesh(new THREE.SphereGeometry(0.09, 8, 6), M("#f2c230", { emissive: "#6a4a00" }), 0, 0.66, 0.62)); return g; },
  bald() { const g = new THREE.Group(); const d = mesh(new THREE.SphereGeometry(0.56, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), M("#e9b48c", { flatShading: false, roughness: 0.5 }), 0, 0.42, -0.02); d.scale.set(0.93, 0.95, 0.97); g.add(d); const hair = M("#8c8880"); for (let k = 0; k < 11; k++) { const a = Math.PI * (0.5 + k * 0.1); const h = mesh(new THREE.SphereGeometry(0.12, 8, 6), hair, Math.sin(a) * 0.5, 0.46 + (k % 2) * 0.03, Math.cos(a) * 0.46 - 0.08); h.scale.set(1, 0.8, 1); g.add(h); } return g; },
  bandana(c) { const g = new THREE.Group(); g.add(mesh(new THREE.SphereGeometry(0.58, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2.2), M(c), 0, 0.5, -0.02)); g.add(mesh(new THREE.ConeGeometry(0.16, 0.42, 6), M(c), 0, 0.45, -0.6, -1.9)); return g; },
  glasses() { const g = new THREE.Group(); const m = M("#2a1a10"); [-0.2, 0.2].forEach((x) => g.add(mesh(new THREE.TorusGeometry(0.13, 0.025, 6, 14), m, x, 0.4, 0.56))); g.add(mesh(new THREE.BoxGeometry(0.14, 0.03, 0.03), m, 0, 0.42, 0.56)); g.add(mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.12, 14), M("#3a2a20"), 0, 0.82, 0)); g.add(mesh(new THREE.CylinderGeometry(0.4, 0.44, 0.45, 14), M("#3a2a20"), 0, 1.08, 0)); return g; },
  beret(c) { const g = new THREE.Group(); const b = mesh(new THREE.SphereGeometry(0.62, 12, 8), M(c), 0.08, 0.78, -0.05); b.scale.set(1, 0.38, 1); g.add(b); g.add(mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.12, 6), M(c), 0.08, 1.0, -0.05)); return g; },
  pack() { const g = new THREE.Group(); g.add(mesh(new THREE.BoxGeometry(0.62, 0.72, 0.34), M("#7a5634"), 0, 0.45, -0.42)); g.add(mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.66, 10), M("#3a6a8a"), 0, 0.9, -0.42, 0, 0, Math.PI / 2)); return g; },
  apron() { const g = new THREE.Group(); g.add(mesh(new THREE.BoxGeometry(0.6, 0.5, 0.04), M("#ffffff"), 0, -0.2, 0.42)); return g; },
  rod() { const g = new THREE.Group(); g.add(mesh(new THREE.CylinderGeometry(0.02, 0.03, 2.4, 6), M("#8a6a3a"), 0, 0.5, 1.2, 0.5)); return g; },
};
const LOOKS = [
  { name: "漁夫", note: "黃雨衣、黃雨帽", model: "Barbarian", body: "#f2c230", legs: "#2f4a6a", head: [["sou", "#e8b820"]], back: [], color: "#d8a010" },
  { name: "麵包師", note: "白衣、高廚師帽、圍裙", model: "Knight", body: "#f4efe4", legs: "#c8a070", head: [["chef"]], chest: [["apron"]], color: "#b07a3a" },
  { name: "花農", note: "草綠背帶褲、長髮", model: "Rogue", body: "#6cc04a", legs: "#3a6a9a", head: [], color: "#4f8a3a" },
  { name: "燈塔學徒", note: "藏青水手服、水手帽", model: "Knight", body: "#1f3462", legs: "#eef0f4", head: [["sailor"]], color: "#2e4a7a" },
  { name: "船匠", note: "光頭、皮背心", model: "Barbarian", body: "#8a5432", legs: "#4a3a2a", head: [["bald"]], color: "#a03c24" },
  { name: "書店老闆", note: "酒紅外套、圓眼鏡、高禮帽", model: "Mage", body: "#7a1e34", legs: "#2a2a34", head: [["glasses"]], color: "#8a2a3a" },
  { name: "畫家", note: "粉紫罩衫、貝雷帽", model: "Rogue", body: "#c9a0e8", legs: "#4a4a5a", head: [["beret", "#2a2a3a"]], color: "#8a62c4" },
  { name: "旅人", note: "綠兜帽、灰外套、大背包", model: "Rogue_Hooded", body: "#8a8a92", legs: "#5a4a3a", keepHood: true, chest: [["pack"]], color: "#6a6a72" },
];
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#cfe3f2"); scene.fog = new THREE.Fog(scene.background, 14, 30);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
const sun = new THREE.DirectionalLight("#fff2dc", 2.6); sun.position.set(6, 10, 7); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 10, bottom: -8 }); sun.shadow.bias = -0.0004; scene.add(sun); scene.add(new THREE.HemisphereLight("#dfeeff", "#8a7a60", 0.9));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: "#9cc47a", roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const loader = new GLTFLoader(); const cache = {};
// Blender 做的配件（tools/make_accessories.py 產生）；?acc=prim 改回程式拼的版本做比較
const USE_GLB = new URLSearchParams(location.search).get("acc") !== "prim";
const GLB_OF = { sou: "sou", chef: "chef", sailor: "sailor", glasses: "tophat", beret: "beret", pack: "pack", apron: "apron" }; const glb = {}; const mixers = []; const tags = []; const gap = 1.55; const v = new THREE.Vector3();
(async () => {
  await Promise.all([...new Set(LOOKS.map((l) => l.model))].map(async (m) => { cache[m] = await loader.loadAsync("../assets/chars/" + m + ".json"); }));
  if (USE_GLB) await Promise.all([...new Set(Object.values(GLB_OF).concat(["fringe"]))].map(async (n) => { glb[n] = (await loader.loadAsync("../assets/acc/" + n + ".glb")).scene; }));
  const acc = (k, c) => { if (!USE_GLB) return ACC[k](c); if (k === "bald") { const g = ACC.bald(c); g.children.slice(1).forEach((h) => g.remove(h)); g.add(glb.fringe.clone()); return g; } if (GLB_OF[k]) { const o = glb[GLB_OF[k]].clone(); o.traverse((m) => { if (m.isMesh) m.castShadow = true; }); return o; } return ACC[k](c); };
  LOOKS.forEach((l, i) => {
    const x = (i - (LOOKS.length - 1) / 2) * gap; const src = cache[l.model]; const model = skClone(src.scene);
    const bodyM = M(l.body, { flatShading: false, roughness: 0.75 }), legM = M(l.legs, { flatShading: false, roughness: 0.75 });
    model.traverse((o) => {
      if (!o.isMesh) return; o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
      if (/Sword|Shield|Axe|Crossbow|Staff|Wand|Knife|Offhand|Throwable|Spellbook|Mug|Cape/.test(o.name)) o.visible = false;
      else if (/Hat|Helmet/.test(o.name)) o.visible = false;
      else if (/Body|Arm/.test(o.name)) o.material = bodyM;
      else if (/Leg/.test(o.name)) o.material = legM;
    });
    const head = model.getObjectByName("head"); (l.head || []).forEach(([k, c]) => head && head.add(acc(k, c)));
    const chest = model.getObjectByName("chest") || model.getObjectByName("spine") || model; (l.chest || []).forEach(([k, c]) => chest.add(acc(k, c)));
    model.position.set(x, 0, 0); model.rotation.y = 0.2; scene.add(model);
    const mix = new THREE.AnimationMixer(model); const clip = src.animations.find((a) => a.name === "Idle"); const a = mix.clipAction(clip); a.play(); a.time = i * 0.37; mixers.push(mix);
    const el = document.createElement("div"); el.className = "lbl"; el.innerHTML = `<b style="background:${l.color}">${l.name}</b><i>${l.note}</i>`; document.body.appendChild(el); tags.push({ el, p: new THREE.Vector3(x, 0, 0.7) });
  });
  setTimeout(() => window.__ready = true, 600);
})();
const clock = new THREE.Clock();
function frame() {
  const dt = clock.getDelta(); mixers.forEach((m) => m.update(dt));
  const w = (LOOKS.length - 1) * gap + 4; camera.position.set(0, 1.9, w * 0.62 + 2.6); camera.lookAt(0, 0.95, 0);
  renderer.render(scene, camera);
  tags.forEach(({ el, p }) => { v.copy(p).project(camera); el.style.left = (v.x * 0.5 + 0.5) * innerWidth + "px"; el.style.top = (-v.y * 0.5 + 0.5) * innerHeight + 8 + "px"; });
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
